<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SmartDoc Organizer</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs";

    window.pdfjsLib = pdfjsLib;
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 30px;
    }

    .upload-box {
      border: 2px dashed #9ca3af;
      border-radius: 14px;
      padding: 45px 20px;
      text-align: center;
      background: white;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload-box:hover,
    .upload-box.dragover {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .upload-box strong {
      display: block;
      font-size: 20px;
      margin-bottom: 10px;
    }

    input[type="file"] {
      display: none;
    }

    .status {
      margin-top: 25px;
      padding: 15px;
      border-radius: 10px;
      background: white;
      display: none;
    }

    .result {
      margin-top: 25px;
      background: white;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
      display: none;
    }

    .success {
      padding: 12px;
      background: #ecfdf5;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .filename {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 8px;
      word-break: break-all;
      font-family: monospace;
      margin-top: 8px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #6b7280;
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
      margin-right: 8px;
    }

    .download-btn {
      background: #2563eb;
      color: white;
    }

    .copy-btn {
      background: #111827;
      color: white;
    }

    .raw-btn {
      background: #e5e7eb;
      color: #111827;
    }

    .raw-text {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: #111827;
      color: #f9fafb;
      border-radius: 8px;
      white-space: pre-wrap;
      max-height: 400px;
      overflow: auto;
      font-size: 13px;
    }

    .loading {
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SmartDoc Organizer</h1>

  <div class="subtitle">
    Upload a document and SmartDoc will read, understand and organize it.
  </div>

  <label class="upload-box" id="uploadBox">
    <strong>Drop a PDF here</strong>
    <span>or click to choose a PDF</span>
    <br><br>
    <small>SmartDoc can read normal PDFs and scanned PDFs using OCR.</small>

    <input
      type="file"
      id="fileInput"
      accept="application/pdf,.pdf"
    >
  </label>

  <div class="status" id="status"></div>

  <div class="result" id="result"></div>

</div>

<script>

let currentFile = null;
let currentSuggestedFilename = "";
let currentRawText = "";


/* -----------------------------
   BASIC TEXT CLEANING
----------------------------- */

function cleanText(text) {
  return (text || "")
    .replace(/\r/g, " ")
    .replace(/\n+/g, "\n")
    .replace(/[ \t]+/g, " ")
    .trim();
}


/* -----------------------------
   DOCUMENT TYPE
----------------------------- */

function detectDocumentType(text) {

  const lower =
    text.toLowerCase()
      .replace(/\s+/g, " ")
      .trim();

  if (
    /\binvoice\s*(number|no|#|date)?\b/i.test(lower) ||
    /\bfacture\s*(n°|no|numero|numéro|date)?\b/i.test(lower) ||
    /\btotal\s+(due|amount|ttc)\b/i.test(lower)
  ) {
    return "Invoice";
  }

  if (
    /\breceipt\b/i.test(lower) ||
    /\breçu\b/i.test(lower) ||
    /\bticket\s+de\s+caisse\b/i.test(lower)
  ) {
    return "Receipt";
  }

  const resumeSignals = [
    /\bresume\b/i,
    /\bcurriculum vitae\b/i,
    /\bresume samples\b/i,
    /\bwork history\b/i,
    /\bprofessional accomplishments\b/i,
    /\bprofessional experience\b/i,
    /\bprofessional experiences\b/i,
    /\bexperiences professionnelles\b/i,
    /\beducation\b/i,
    /\bsummary of qualifications\b/i,
    /\bcompétences\b/i,
    /\blangues\b/i,
    /\bobjective\b/i
  ];

  let resumeScore = 0;

  for (const signal of resumeSignals) {
    if (signal.test(lower)) {
      resumeScore++;
    }
  }

  if (resumeScore >= 2) {
    return "Resume / CV";
  }

  const contractSignals = [
    /\bcontract\b/i,
    /\bagreement\b/i,
    /\bcontrat\b/i,
    /\bterms and conditions\b/i,
    /\bsignature\b.*\bdate\b/i
  ];

  let contractScore = 0;

  for (const signal of contractSignals) {
    if (signal.test(lower)) {
      contractScore++;
    }
  }

  if (contractScore >= 2) {
    return "Contract";
  }

  if (
    /\bmarketing campaign\b/i.test(lower) ||
    /\bmarketing plan\b/i.test(lower) ||
    /\bcampagne marketing\b/i.test(lower)
  ) {
    return "Marketing";
  }

  if (
    /\boperations report\b/i.test(lower) ||
    /\boperations manual\b/i.test(lower) ||
    /\bprocédure opérationnelle\b/i.test(lower)
  ) {
    return "Operations";
  }

  return "Document";
}


/* -----------------------------
   EMAIL
----------------------------- */

function extractEmail(text) {

  const match = text.match(
    /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i
  );

  return match ? match[0] : "";
}


/* -----------------------------
   PHONE
----------------------------- */

function extractPhone(text) {

  const matches = text.match(
    /(?:\+?\d[\d\s().-]{7,}\d)/g
  );

  if (!matches) {
    return "";
  }

  return matches[0].trim();
}


/* -----------------------------
   BIRTH DATE
----------------------------- */

function extractBirthDate(text) {

  const patterns = [

    /\b(\d{1,2})\s+(jan(?:uary|vier)?|feb(?:ruary|ruary)?|mars|march|avr(?:il)?|april|mai|may|juin|june|juil(?:let)?|july|août|august|sept(?:embre|ember)?|oct(?:obre|ober)?|nov(?:embre|ember)?|déc(?:embre)?|december)\.?\s+(\d{4})\b/i,

    /\b(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})\b/,

    /\b(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})\b/
  ];

  for (const pattern of patterns) {

    const match = text.match(pattern);

    if (match) {
      return match[0];
    }
  }

  return "";
}


/* -----------------------------
   LOCATION
----------------------------- */

function extractLocation(text) {

  const locations = [
    "Marrakech",
    "Casablanca",
    "Rabat",
    "Agadir",
    "Tangier",
    "Tanger",
    "Fez",
    "Fes",
    "Meknes",
    "Oujda",
    "Bellevue",
    "Omaha",
    "New York",
    "Chicago",
    "Boston",
    "Los Angeles"
  ];

  for (const location of locations) {

    const regex =
      new RegExp("\\b" + location + "\\b", "i");

    if (regex.test(text)) {
      return location;
    }
  }

  return "";
}


/* -----------------------------
   LANGUAGES
----------------------------- */

function extractLanguages(text) {

  const found = [];

  const languages = [
    ["French", /\bfrench\b|\bfrançais\b/i],
    ["English", /\benglish\b|\banglais\b/i],
    ["Arabic", /\barabic\b|\barabe\b/i],
    ["Spanish", /\bspanish\b|\bespañol\b/i],
    ["German", /\bgerman\b|\ballemand\b/i],
    ["Italian", /\bitalian\b|\bitalien\b/i]
  ];

  for (const [name, regex] of languages) {

    if (regex.test(text)) {
      found.push(name);
    }
  }

  return found.join(", ");
}


/* -----------------------------
   PROFESSION
----------------------------- */

function extractProfession(text) {

  const lower = text.toLowerCase();

  const professions = [

    ["Barman / Mixologist",
      /barman|mixologist|bartender/i],

    ["Manager",
      /\bmanager\b|management/i],

    ["Accountant",
      /accountant|accounting/i],

    ["Marketing",
      /marketing|public relations/i],

    ["Developer",
      /software developer|web developer|developer/i],

    ["Designer",
      /graphic designer|designer/i],

    ["Engineer",
      /engineer|engineering/i],

    ["Teacher",
      /teacher|teaching/i],

    ["Chef",
      /\bchef\b|cook/i],

    ["Sales",
      /sales representative|sales manager|sales/i]
  ];

  for (const [profession, regex] of professions) {

    if (regex.test(lower)) {
      return profession;
    }
  }

  return "";
}


/* -----------------------------
   NAME
----------------------------- */

function extractName(text) {

  const lines = text
    .split("\n")
    .map(line => line.trim())
    .filter(Boolean);

  const email = extractEmail(text);

  for (let i = 0; i < Math.min(lines.length, 40); i++) {

    const line = lines[i];

    if (email && line.includes(email)) {
      continue;
    }

    if (
      /resume samples/i.test(line) ||
      /curriculum vitae/i.test(line) ||
      /professional experience/i.test(line) ||
      /experiences professionnelles/i.test(line) ||
      /education/i.test(line) ||
      /languages/i.test(line) ||
      /compétences/i.test(line) ||
      /summary of qualifications/i.test(line)
    ) {
      continue;
    }

    if (
      /^(KHALID)$/i.test(line)
    ) {
      return line;
    }

    if (
      /^[A-ZÀ-Ÿ][A-ZÀ-Ÿa-zà-ÿ'’-]{2,20}(?:\s+[A-ZÀ-Ÿ][A-ZÀ-Ÿa-zà-ÿ'’-]{2,20}){1,3}$/
        .test(line)
    ) {

      if (
        line.length < 50 &&
        !/\d/.test(line)
      ) {
        return line;
      }
    }
  }

  return "";
}


/* -----------------------------
   FILENAME
----------------------------- */

function safeFilenamePart(value) {

  return (value || "")
    .replace(/[<>:"/\\|?*]/g, "")
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "");
}


function makeFilename(info, originalName) {

  const parts = [];

  const name =
    safeFilenamePart(info.name);

  const profession =
    safeFilenamePart(info.profession);

  const type =
    safeFilenamePart(
      info.documentType
        .replace(/\//g, "-")
    );

  const location =
    safeFilenamePart(info.location);

  if (name) {
    parts.push(name);
  }

  if (profession) {
    parts.push(profession);
  }

  if (type) {
    parts.push(type);
  }

  if (location) {
    parts.push(location);
  }

  if (parts.length === 0) {

    const base =
      originalName
        .replace(/\.pdf$/i, "");

    return safeFilenamePart(base) + ".pdf";
  }

  return parts.join("_") + ".pdf";
}


/* -----------------------------
   PDF TEXT EXTRACTION
----------------------------- */

async function extractPdfText(file) {

  const arrayBuffer =
    await file.arrayBuffer();

  const pdf =
    await window.pdfjsLib.getDocument({
      data: arrayBuffer
    }).promise;

  let fullText = "";

  const maxPages =
    Math.min(pdf.numPages, 10);

  for (let pageNumber = 1;
       pageNumber <= maxPages;
       pageNumber++) {

    const page =
      await pdf.getPage(pageNumber);

    const content =
      await page.getTextContent();

    const pageText =
      content.items
        .map(item => item.str)
        .join(" ");

    fullText += "\n" + pageText;
  }

  return {
    text: cleanText(fullText),
    pdf
  };
}


/* -----------------------------
   OCR
----------------------------- */

async function runOCR(file, pdf) {

  let text = "";

  const maxPages =
    Math.min(pdf.numPages, 3);

  for (let pageNumber = 1;
       pageNumber <= maxPages;
       pageNumber++) {

    const page =
      await pdf.getPage(pageNumber);

    const viewport =
      page.getViewport({
        scale: 2.5
      });

    const canvas =
      document.createElement("canvas");

    const context =
      canvas.getContext("2d");

    canvas.width =
      viewport.width;

    canvas.height =
      viewport.height;

    await page.render({
      canvasContext: context,
      viewport: viewport
    }).promise;

    const result =
      await Tesseract.recognize(
        canvas,
        "eng",
        {
          logger: message => {

            if (message.status === "recognizing text") {

              const percent =
                Math.round(
                  (message.progress || 0) * 100
                );

              setStatus(
                "OCR in progress... " +
                percent +
                "%"
              );
            }
          }
        }
      );

    text += "\n" + result.data.text;
  }

  return cleanText(text);
}


/* -----------------------------
   ANALYSIS
----------------------------- */

async function analyzeFile(file) {

  currentFile = file;

  setStatus(
    "Reading " + file.name + "..."
  );

  let pdfResult =
    await extractPdfText(file);

  let text =
    pdfResult.text;

  let usedOCR = false;

  if (
    text.replace(/\s/g, "").length < 30
  ) {

    usedOCR = true;

    setStatus(
      "This looks like a scanned PDF. Starting OCR..."
    );

    text =
      await runOCR(
        file,
        pdfResult.pdf
      );
  }

  currentRawText = text;

  displayResult(
    file,
    text,
    usedOCR
  );
}


/* -----------------------------
   DISPLAY RESULT
----------------------------- */

function displayResult(
  file,
  text,
  usedOCR
) {

  const clean =
    cleanText(text);

  const info = {

    documentType:
      detectDocumentType(clean),

    name:
      extractName(clean),

    profession:
      extractProfession(clean),

    location:
      extractLocation(clean),

    email:
      extractEmail(clean),

    phone:
      extractPhone(clean),

    languages:
      extractLanguages(clean),

    birthDate:
      extractBirthDate(clean)
  };

  currentSuggestedFilename =
    makeFilename(
      info,
      file.name
    );

  const resultCard =
    document.getElementById("result");

  resultCard.innerHTML = "";

  const success =
    document.createElement("div");

  success.className =
    "success";

  success.textContent =
    "✓ Document successfully analyzed";

  resultCard.appendChild(success);


  const fileName =
    document.createElement("p");

  fileName.innerHTML =
    "<strong>" +
    escapeHtml(file.name) +
    "</strong>";

  resultCard.appendChild(fileName);


  const method =
    document.createElement("p");

  method.innerHTML =
    "<strong>Analysis method:</strong> " +
    (usedOCR ? "OCR" : "PDF text");

  resultCard.appendChild(method);


  addEditableField(
    resultCard,
    "Document type",
    info.documentType
  );

  addEditableField(
    resultCard,
    "Name",
    info.name
  );

  addEditableField(
    resultCard,
    "Profession",
    info.profession
  );

  addEditableField(
    resultCard,
    "Location",
    info.location
  );

  addEditableField(
    resultCard,
    "Email",
    info.email
  );

  addEditableField(
    resultCard,
    "Phone",
    info.phone
  );

  addEditableField(
    resultCard,
    "Languages",
    info.languages
  );

  addEditableField(
    resultCard,
    "Birth date",
    info.birthDate
  );


  const filenameTitle =
    document.createElement("p");

  filenameTitle.innerHTML =
    "<strong>Suggested filename:</strong>";

  filenameTitle.style.marginTop =
    "25px";

  resultCard.appendChild(
    filenameTitle
  );


  const filenameBox =
    document.createElement("div");

  filenameBox.className =
    "filename";

  filenameBox.id =
    "filenameBox";

  filenameBox.textContent =
    currentSuggestedFilename;

  resultCard.appendChild(
    filenameBox
  );


  const downloadButton =
    document.createElement("button");

  downloadButton.className =
    "download-btn";

  downloadButton.textContent =
    "Download organized PDF";

  downloadButton.onclick =
    downloadOrganizedFile;

  resultCard.appendChild(
    downloadButton
  );


  const copyButton =
    document.createElement("button");

  copyButton.className =
    "copy-btn";

  copyButton.textContent =
    "Copy filename";

  copyButton.onclick =
    copyFilename;

  resultCard.appendChild(
    copyButton
  );


  const rawButton =
    document.createElement("button");

  rawButton.className =
    "raw-btn";

  rawButton.textContent =
    "Show raw OCR / PDF text";

  rawButton.onclick =
    () => {

      const raw =
        document.getElementById("rawText");

      raw.style.display =
        raw.style.display === "none"
          ? "block"
          : "none";
    };

  resultCard.appendChild(
    rawButton
  );


  const rawText =
    document.createElement("div");

  rawText.className =
    "raw-text";

  rawText.id =
    "rawText";

  rawText.textContent =
    clean;

  resultCard.appendChild(
    rawText
  );


  resultCard.style.display =
    "block";

  setStatus(
    "Analysis complete."
  );
}


/* -----------------------------
   EDITABLE FIELDS
----------------------------- */

function addEditableField(
  container,
  label,
  value
) {

  const field =
    document.createElement("div");

  field.className =
    "field";

  const labelElement =
    document.createElement("label");

  labelElement.textContent =
    label;

  const input =
    document.createElement("input");

  input.value =
    value || "";

  input.dataset.field =
    label;

  input.addEventListener(
    "input",
    updateFilename
  );

  field.appendChild(
    labelElement
  );

  field.appendChild(
    input
  );

  container.appendChild(
    field
  );
}


/* -----------------------------
   UPDATE FILENAME
----------------------------- */

function updateFilename() {

  const fields =
    document.querySelectorAll(
      "#result input"
    );

  const values = {};

  fields.forEach(input => {

    values[input.dataset.field] =
      input.value.trim();
  });

  const info = {

    name:
      values["Name"] || "",

    profession:
      values["Profession"] || "",

    documentType:
      values["Document type"] || "Document",

    location:
      values["Location"] || ""
  };

  currentSuggestedFilename =
    makeFilename(
      info,
      currentFile
        ? currentFile.name
        : "document.pdf"
    );

  const filenameBox =
    document.getElementById(
      "filenameBox"
    );

  if (filenameBox) {

    filenameBox.textContent =
      currentSuggestedFilename;
  }
}


/* -----------------------------
   DOWNLOAD ORGANIZED PDF
----------------------------- */

function downloadOrganizedFile() {

  if (!currentFile) {
    return;
  }

  updateFilename();

  const url =
    URL.createObjectURL(
      currentFile
    );

  const link =
    document.createElement("a");

  link.href =
    url;

  link.download =
    currentSuggestedFilename;

  document.body.appendChild(
    link
  );

  link.click();

  link.remove();

  setTimeout(() => {
    URL.revokeObjectURL(url);
  }, 1000);
}


/* -----------------------------
   COPY FILENAME
----------------------------- */

async function copyFilename() {

  updateFilename();

  try {

    await navigator.clipboard.writeText(
      currentSuggestedFilename
    );

    setStatus(
      "Filename copied."
    );

  } catch (error) {

    setStatus(
      "Could not copy filename."
    );
  }
}


/* -----------------------------
   STATUS
----------------------------- */

function setStatus(message) {

  const status =
    document.getElementById(
      "status"
    );

  status.textContent =
    message;

  status.style.display =
    "block";
}


/* -----------------------------
   HTML ESCAPE
----------------------------- */

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* -----------------------------
   FILE HANDLING
----------------------------- */

const fileInput =
  document.getElementById(
    "fileInput"
  );

const uploadBox =
  document.getElementById(
    "uploadBox"
  );


fileInput.addEventListener(
  "change",
  event => {

    const file =
      event.target.files[0];

    if (file) {
      handleFile(file);
    }
  }
);


uploadBox.addEventListener(
  "dragover",
  event => {

    event.preventDefault();

    uploadBox.classList.add(
      "dragover"
    );
  }
);


uploadBox.addEventListener(
  "dragleave",
  () => {

    uploadBox.classList.remove(
      "dragover"
    );
  }
);


uploadBox.addEventListener(
  "drop",
  event => {

    event.preventDefault();

    uploadBox.classList.remove(
      "dragover"
    );

    const file =
      event.dataTransfer.files[0];

    if (file) {
      handleFile(file);
    }
  }
);


/* -----------------------------
   HANDLE FILE
----------------------------- */

async function handleFile(file) {

  if (
    file.type !== "application/pdf" &&
    !file.name.toLowerCase().endsWith(".pdf")
  ) {

    setStatus(
      "Please upload a PDF file."
    );

    return;
  }

  const result =
    document.getElementById(
      "result"
    );

  result.style.display =
    "none";

  try {

    await analyzeFile(file);

  } catch (error) {

    console.error(error);

    setStatus(
      "Something went wrong while analyzing the PDF."
    );
  }
}

</script>

</body>
</html>
