<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDoc Organizer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 36px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 30px;
    }

    .upload-box {
      background: white;
      border: 2px dashed #9ca3af;
      border-radius: 16px;
      padding: 45px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload-box:hover,
    .upload-box.dragover {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .upload-box h2 {
      margin: 0 0 10px;
    }

    .upload-box p {
      color: #6b7280;
    }

    #fileInput {
      display: none;
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 22px;
      background: #2563eb;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin: 25px 0;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .stat-number {
      font-size: 28px;
      font-weight: bold;
    }

    .stat-label {
      color: #6b7280;
      margin-top: 5px;
    }

    .results {
      display: grid;
      gap: 20px;
    }

    .category {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .category h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .file {
      border-top: 1px solid #e5e7eb;
      padding: 14px 0;
    }

    .original {
      font-weight: bold;
      word-break: break-word;
    }

    .suggestion {
      margin-top: 6px;
      color: #2563eb;
      font-size: 14px;
      word-break: break-word;
    }

    .empty {
      color: #9ca3af;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>SmartDoc Organizer</h1>

    <p class="subtitle">
      Upload your documents and automatically organize them.
    </p>

    <div class="upload-box" id="uploadBox">

      <h2>Drop your files here</h2>

      <p>or choose files from your computer</p>

      <label class="button" for="fileInput">
        Choose Files
      </label>

      <input
        type="file"
        id="fileInput"
        multiple
      >

    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-number" id="totalFiles">0</div>
        <div class="stat-label">Files</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="financeCount">0</div>
        <div class="stat-label">Finance</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="hrCount">0</div>
        <div class="stat-label">HR</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="legalCount">0</div>
        <div class="stat-label">Legal</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="otherCount">0</div>
        <div class="stat-label">Other</div>
      </div>

    </div>

    <div id="results" class="results">

      <div class="empty">
        No documents uploaded yet.
      </div>

    </div>

  </div>

<script>

const uploadBox = document.getElementById("uploadBox");
const fileInput = document.getElementById("fileInput");
const results = document.getElementById("results");

const totalFiles = document.getElementById("totalFiles");
const financeCount = document.getElementById("financeCount");
const hrCount = document.getElementById("hrCount");
const legalCount = document.getElementById("legalCount");
const otherCount = document.getElementById("otherCount");

const categories = [
  "Finance",
  "Human Resources",
  "Legal",
  "Marketing",
  "Operations",
  "Other"
];

fileInput.addEventListener("change", function() {
  organizeFiles(fileInput.files);
});

uploadBox.addEventListener("dragover", function(event) {
  event.preventDefault();
  uploadBox.classList.add("dragover");
});

uploadBox.addEventListener("dragleave", function() {
  uploadBox.classList.remove("dragover");
});

uploadBox.addEventListener("drop", function(event) {
  event.preventDefault();

  uploadBox.classList.remove("dragover");

  organizeFiles(event.dataTransfer.files);
});

function getCategory(filename) {

  const name = filename.toLowerCase();

  if (
    name.includes("invoice") ||
    name.includes("receipt") ||
    name.includes("payment") ||
    name.includes("salary") ||
    name.includes("budget") ||
    name.includes("tax")
  ) {
    return "Finance";
  }

  if (
    name.includes("cv") ||
    name.includes("resume") ||
    name.includes("employee") ||
    name.includes("hr") ||
    name.includes("contractor") ||
    name.includes("payroll")
  ) {
    return "Human Resources";
  }

  if (
    name.includes("contract") ||
    name.includes("agreement") ||
    name.includes("legal") ||
    name.includes("nda") ||
    name.includes("terms")
  ) {
    return "Legal";
  }

  if (
    name.includes("marketing") ||
    name.includes("campaign") ||
    name.includes("advert") ||
    name.includes("social")
  ) {
    return "Marketing";
  }

  if (
    name.includes("project") ||
    name.includes("report") ||
    name.includes("meeting") ||
    name.includes("operations")
  ) {
    return "Operations";
  }

  return "Other";
}

function cleanFilename(filename) {

  const extension = filename.includes(".")
    ? filename.substring(filename.lastIndexOf("."))
    : "";

  let name = filename.replace(extension, "");

  name = name
    .replace(/[_-]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  name = name
    .split(" ")
    .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
    .join("_");

  return name + extension.toLowerCase();
}

function organizeFiles(files) {

  const grouped = {};

  categories.forEach(category => {
    grouped[category] = [];
  });

  Array.from(files).forEach(file => {

    const category = getCategory(file.name);

    grouped[category].push({
      original: file.name,
      suggested: cleanFilename(file.name)
    });

  });

  displayResults(grouped);

}

function displayResults(grouped) {

  results.innerHTML = "";

  let total = 0;

  categories.forEach(category => {

    const files = grouped[category];

    total += files.length;

    if (files.length === 0) {
      return;
    }

    const categoryBox = document.createElement("div");

    categoryBox.className = "category";

    categoryBox.innerHTML = `
      <h2>${category} (${files.length})</h2>
    `;

    files.forEach(file => {

      const fileBox = document.createElement("div");

      fileBox.className = "file";

      fileBox.innerHTML = `
        <div class="original">
          ${escapeHtml(file.original)}
        </div>

        <div class="suggestion">
          Suggested name: ${escapeHtml(file.suggested)}
        </div>
      `;

      categoryBox.appendChild(fileBox);

    });

    results.appendChild(categoryBox);

  });

  totalFiles.textContent = total;

  financeCount.textContent = grouped["Finance"].length;

  hrCount.textContent = grouped["Human Resources"].length;

  legalCount.textContent = grouped["Legal"].length;

  otherCount.textContent =
    grouped["Other"].length +
    grouped["Marketing"].length +
    grouped["Operations"].length;

}

function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
</html>
