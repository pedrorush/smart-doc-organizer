<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartDoc Organizer</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>

<!-- Tesseract.js -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #202733;
  }

  .container {
    width: min(900px, calc(100% - 32px));
    margin: 40px auto;
  }

  h1 { margin: 0 0 8px; }
  .subtitle { color: #667085; margin: 0 0 24px; }

  .upload-box {
    background: #fff;
    border: 2px dashed #98a2b3;
    border-radius: 14px;
    padding: 36px 20px;
    text-align: center;
    transition: .2s;
  }

  .upload-box.dragover {
    border-color: #2563eb;
    background: #eff6ff;
  }

  .pdf-icon { font-size: 34px; margin-bottom: 8px; }

  .upload-button,
  button {
    display: inline-block;
    border: 0;
    border-radius: 8px;
    padding: 11px 16px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: #2563eb;
    color: #fff;
  }

  .upload-button:hover, button:hover { background: #1d4ed8; }

  input[type="file"] { display: none; }

  .hint {
    margin-top: 12px;
    color: #667085;
    font-size: 14px;
  }

  .status {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 8px;
    display: none;
    white-space: pre-wrap;
  }

  .status.show { display: block; }
  .status.info { background: #eff6ff; color: #1d4ed8; }
  .status.success { background: #ecfdf3; color: #027a48; }
  .status.error { background: #fef3f2; color: #b42318; }

  .document {
    margin-top: 24px;
    background: #fff;
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 3px 16px rgba(16, 24, 40, .08);
  }

  .success-title {
    color: #027a48;
    margin-top: 0;
  }

  .meta {
    color: #667085;
    font-size: 14px;
    margin: 6px 0;
  }

  hr {
    border: 0;
    border-top: 1px solid #eaecf0;
    margin: 20px 0;
  }

  .field {
    margin: 14px 0;
  }

  .field label {
    display: block;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    font-size: 15px;
    background: #fff;
  }

  .field input:focus {
    outline: 2px solid #bfdbfe;
    border-color: #2563eb;
  }

  .filename-box {
    margin-top: 20px;
    padding: 16px;
    background: #f8fafc;
    border-radius: 10px;
  }

  .filename {
    margin-top: 8px;
    word-break: break-word;
    font-family: monospace;
    font-size: 14px;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 14px;
  }

  .secondary {
    background: #475467;
  }

  .secondary:hover { background: #344054; }

  details {
    margin-top: 18px;
  }

  summary {
    cursor: pointer;
    font-weight: 700;
  }

  pre {
    white-space: pre-wrap;
    word-break: break-word;
    background: #101828;
    color: #f8fafc;
    padding: 16px;
    border-radius: 8px;
    max-height: 500px;
    overflow: auto;
    font-size: 12px;
  }

  .progress {
    height: 8px;
    background: #eaecf0;
    border-radius: 999px;
    overflow: hidden;
    margin-top: 10px;
  }

  .progress-bar {
    width: 0%;
    height: 100%;
    background: #2563eb;
    transition: width .2s;
  }
</style>
</head>

<body>
<div class="container">
  <h1>SmartDoc Organizer</h1>
  <p class="subtitle">
    Upload a document and SmartDoc will read, understand and organize it.
  </p>

  <div id="uploadBox" class="upload-box">
    <div class="pdf-icon">📄</div>
    <p><strong>Drop a PDF here</strong></p>
    <p>or</p>

    <label for="pdfInput" class="upload-button">Click to choose a PDF</label>
    <input id="pdfInput" type="file" accept="application/pdf,.pdf">

    <div class="hint">
      SmartDoc can read normal PDFs and scanned PDFs using OCR.
    </div>
  </div>

  <div id="status" class="status"></div>

  <div id="progressWrap" style="display:none">
    <div class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>
  </div>

  <div id="results"></div>
</div>

<script type="module">
  // ------------------------------------------------------------
  // SmartDoc Organizer - stable single-file version
  // ------------------------------------------------------------

  const pdfInput = document.getElementById("pdfInput");
  const uploadBox = document.getElementById("uploadBox");
  const statusBox = document.getElementById("status");
  const resultsBox = document.getElementById("results");
  const progressWrap = document.getElementById("progressWrap");
  const progressBar = document.getElementById("progressBar");

  let pdfjsLib = null;
  let ocrWorker = null;

  // PDF.js 4.x is an ES module, so import it here.
  try {
    pdfjsLib = await import(
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
    );

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
  } catch (error) {
    console.error("PDF.js failed to load:", error);
  }

  function showStatus(message, type = "info") {
    statusBox.textContent = message;
    statusBox.className = "status show " + type;
  }

  function setProgress(percent) {
    progressWrap.style.display = "block";
    progressBar.style.width = Math.max(0, Math.min(100, percent)) + "%";
  }

  function hideProgress() {
    progressWrap.style.display = "none";
    progressBar.style.width = "0%";
  }

  function cleanText(text) {
    return String(text || "")
      .replace(/\r/g, "\n")
      .replace(/[ \t]+/g, " ")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  function escapeFilenamePart(value) {
    return String(value || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^\p{L}\p{N}\-_ ]/gu, "")
      .trim()
      .replace(/\s+/g, "-")
      .replace(/-+/g, "-");
  }

  function firstUsefulMatch(text, regex) {
    const match = text.match(regex);
    return match ? match[1].trim() : "";
  }

  function extractEmail(text) {
    const match = text.match(
      /\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b/i
    );
    return match ? match[0] : "";
  }

  function extractPhone(text) {
    const matches = text.match(
      /(?:\+?\d[\d\s().-]{7,}\d)/g
    ) || [];

    for (const item of matches) {
      const digits = item.replace(/\D/g, "");
      if (digits.length >= 9 && digits.length <= 15) {
        return item.trim();
      }
    }
    return "";
  }

  function extractBirthDate(text) {
    const patterns = [
      /(?:date\s+of\s+birth|birth\s+date|date\s+de\s+naissance|né[e]?\s+le)\s*[:\-]?\s*([0-3]?\d[\/.\-]\s*[0-1]?\d[\/.\-]\s*(?:19|20)\d{2})/i,
      /\b([0-3]?\d\s+(?:janv(?:ier)?|feb(?:ruary)?|févr(?:ier)?|mars|avril|mai|juin|juil(?:let)?|ao[uû]t|sept(?:embre)?|oct(?:obre)?|nov(?:embre)?|déc(?:embre)?|dec(?:ember)?)\s+(?:19|20)\d{2})\b/i,
      /\b([0-3]?\d[\/.\-][0-1]?\d[\/.\-](?:19|20)\d{2})\b/
    ];

    for (const regex of patterns) {
      const result = firstUsefulMatch(text, regex);
      if (result) return result;
    }
    return "";
  }

  function extractLanguages(text) {
    const found = [];
    const languageMap = [
      ["Arabic", /\barabic\b|\barabe\b/i],
      ["French", /\bfrench\b|\bfrançais\b|\bfrancais\b/i],
      ["English", /\benglish\b|\banglais\b/i],
      ["Spanish", /\bspanish\b|\bespañol\b|\bespagnol\b/i],
      ["German", /\bgerman\b|\ballemand\b/i],
      ["Italian", /\bitalian\b|\bitalien\b/i],
      ["Portuguese", /\bportuguese\b|\bportugais\b/i],
      ["Dutch", /\bdutch\b|\bnéerlandais\b/i]
    ];

    for (const [name, regex] of languageMap) {
      if (regex.test(text)) found.push(name);
    }

    return found.join(", ");
  }

  function extractLocation(text) {
    const patterns = [
      /(?:location|address|adresse)\s*[:\-]?\s*([^\n]+)/i,
      /\b(Marrakech|Marrakesh|Fes|Fez|Casablanca|Rabat|Tangier|Agadir|Morocco|Maroc)\b[^\n]*/i
    ];

    for (const regex of patterns) {
      const value = firstUsefulMatch(text, regex);
      if (value && value.length < 120) return value;
    }

    return "";
  }

  function extractProfession(text) {
    const patterns = [
      /(?:profession|job title|poste|métier)\s*[:\-]?\s*([^\n]+)/i,
      /\b(chef\s+barman(?:\s*\/\s*mixologist)?|barman\s*&\s*mixologue|barman|mixologist|manager|accountant|developer|engineer|teacher|designer)\b/i
    ];

    for (const regex of patterns) {
      const value = firstUsefulMatch(text, regex);
      if (value && value.length < 100) return value;
    }

    return "";
  }

  function extractName(text) {
    const lines = text
      .split("\n")
      .map(x => x.trim())
      .filter(Boolean);

    // Prefer an obvious name before contact details.
    for (let i = 0; i < Math.min(lines.length, 25); i++) {
      const line = lines[i];

      if (
        line.length >= 3 &&
        line.length <= 60 &&
        !/@/.test(line) &&
        !/\d{3,}/.test(line) &&
        !/^(resume|cv|curriculum|profil|profile|experiences?|education|skills|compétences|langues|languages|contact|informations personnelles)$/i.test(line) &&
        /^[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ .'-]+$/.test(line)
      ) {
        const words = line.split(/\s+/);
        if (words.length >= 2 && words.length <= 5) {
          return line;
        }
      }
    }

    return "";
  }

  function detectDocumentType(text) {
    const t = text.toLowerCase();

    if (/\b(invoice|facture)\b/.test(t)) return "Invoice";
    if (/\b(receipt|reçu|recu)\b/.test(t)) return "Receipt";
    if (/\b(contract|contrat|agreement)\b/.test(t)) return "Contract";
    if (/\b(resume|résumé|cv|curriculum vitae|work history|professional experience)\b/.test(t)) return "Resume / CV";
    if (/\b(marketing|campaign|advertising)\b/.test(t)) return "Marketing";
    if (/\b(operation|operations|procédure|procedure)\b/.test(t)) return "Operations";

    return "Document";
  }

  function makeFilename(type, name, profession, location) {
    const safeType = escapeFilenamePart(type);
    const safeName = escapeFilenamePart(name);
    const safeProfession = escapeFilenamePart(profession);
    const safeLocation = escapeFilenamePart(location);

    const parts = [];

    if (safeName) parts.push(safeName);
    if (safeProfession) parts.push(safeProfession);
    if (safeType) parts.push(safeType);
    if (safeLocation) parts.push(safeLocation);

    if (!parts.length) parts.push("SmartDoc-Document");

    return parts.join("_") + ".pdf";
  }

  function getFieldValue(id) {
    const el = document.getElementById(id);
    return el ? el.value.trim() : "";
  }

  function updateFilename() {
    const filename = document.getElementById("filename");
    if (!filename) return;

    filename.textContent = makeFilename(
      getFieldValue("editType"),
      getFieldValue("editName"),
      getFieldValue("editProfession"),
      getFieldValue("editLocation")
    );
  }

  function createField(card, labelText, value, id) {
    const wrapper = document.createElement("div");
    wrapper.className = "field";

    const label = document.createElement("label");
    label.textContent = labelText;
    label.htmlFor = id;

    const input = document.createElement("input");
    input.type = "text";
    input.id = id;
    input.value = value || "";
    input.autocomplete = "off";

    input.addEventListener("input", updateFilename);

    wrapper.appendChild(label);
    wrapper.appendChild(input);
    card.appendChild(wrapper);
  }

  function displayResult(file, text, usedOCR) {
    const clean = cleanText(text);

    const type = detectDocumentType(clean);
    const name = extractName(clean);
    const profession = extractProfession(clean);
    const location = extractLocation(clean);
    const email = extractEmail(clean);
    const phone = extractPhone(clean);
    const languages = extractLanguages(clean);
    const birthDate = extractBirthDate(clean);

    resultsBox.innerHTML = "";

    const card = document.createElement("div");
    card.className = "document";

    const title = document.createElement("h2");
    title.className = "success-title";
    title.textContent = "✓ Document successfully analyzed";
    card.appendChild(title);

    const fileName = document.createElement("p");
    fileName.className = "meta";
    fileName.textContent = file.name;
    card.appendChild(fileName);

    const method = document.createElement("p");
    method.className = "meta";
    method.textContent = "Analysis method: " + (usedOCR ? "OCR" : "PDF text");
    card.appendChild(method);

    card.appendChild(document.createElement("hr"));

    createField(card, "Document type", type, "editType");
    createField(card, "Name", name, "editName");
    createField(card, "Profession", profession, "editProfession");
    createField(card, "Location", location, "editLocation");
    createField(card, "Email", email, "editEmail");
    createField(card, "Phone", phone, "editPhone");
    createField(card, "Languages", languages, "editLanguages");
    createField(card, "Birth date", birthDate, "editBirthDate");

    const filenameBox = document.createElement("div");
    filenameBox.className = "filename-box";

    const filenameTitle = document.createElement("strong");
    filenameTitle.textContent = "Suggested filename:";

    const filename = document.createElement("div");
    filename.className = "filename";
    filename.id = "filename";

    filenameBox.appendChild(filenameTitle);
    filenameBox.appendChild(filename);
    card.appendChild(filenameBox);

    const actions = document.createElement("div");
    actions.className = "actions";

    const copyButton = document.createElement("button");
    copyButton.textContent = "Copy filename";

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(filename.textContent);
        copyButton.textContent = "✓ Copied";
        setTimeout(() => copyButton.textContent = "Copy filename", 1500);
      } catch {
        // Fallback for browsers that block clipboard access.
        const area = document.createElement("textarea");
        area.value = filename.textContent;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
        copyButton.textContent = "✓ Copied";
        setTimeout(() => copyButton.textContent = "Copy filename", 1500);
      }
    });

    const anotherButton = document.createElement("button");
    anotherButton.className = "secondary";
    anotherButton.textContent = "Analyze another PDF";
    anotherButton.addEventListener("click", resetApp);

    actions.appendChild(copyButton);
    actions.appendChild(anotherButton);
    card.appendChild(actions);

    const details = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = usedOCR ? "Show raw OCR text" : "Show raw OCR / PDF text";

    const rawText = document.createElement("pre");
    rawText.textContent = text || "(No text was found.)";

    details.appendChild(summary);
    details.appendChild(rawText);
    card.appendChild(details);

    resultsBox.appendChild(card);
    updateFilename();
  }

  async function extractPdfText(pdf) {
    let fullText = "";

    for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
      const page = await pdf.getPage(pageNumber);
      const content = await page.getTextContent();

      const pageText = content.items
        .map(item => item.str || "")
        .join(" ");

      fullText += pageText + "\n\n";
      setProgress((pageNumber / pdf.numPages) * 50);
    }

    return cleanText(fullText);
  }

  async function getOcrWorker() {
    if (ocrWorker) return ocrWorker;

    if (!window.Tesseract) {
      throw new Error("OCR library could not be loaded.");
    }

    showStatus("Loading OCR engine… This may take a moment the first time.", "info");

    ocrWorker = await Tesseract.createWorker(
      "eng+fra+ara",
      1,
      {
        logger: message => {
          if (message && typeof message.progress === "number") {
            const pct = 50 + message.progress * 50;
            setProgress(pct);
          }
        }
      }
    );

    return ocrWorker;
  }

  async function ocrPdf(pdf) {
    const worker = await getOcrWorker();
    let result = "";

    for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
      showStatus(
        `OCR is reading page ${pageNumber} of ${pdf.numPages}…`,
        "info"
      );

      const page = await pdf.getPage(pageNumber);

      // 2x rendering gives OCR substantially better input than a tiny preview.
      const viewport = page.getViewport({ scale: 2 });

      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d", { willReadFrequently: true });

      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);

      await page.render({
        canvasContext: context,
        viewport
      }).promise;

      const ocr = await worker.recognize(canvas);
      result += (ocr.data.text || "") + "\n\n";

      setProgress(50 + (pageNumber / pdf.numPages) * 50);
    }

    return cleanText(result);
  }

  async function analyzePdf(file) {
    if (!file || file.type !== "application/pdf") {
      throw new Error("Please choose a PDF file.");
    }

    if (!pdfjsLib) {
      throw new Error("PDF reader failed to load. Please refresh the page and try again.");
    }

    resultsBox.innerHTML = "";
    showStatus("Opening PDF…", "info");
    setProgress(5);

    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;

    if (!pdf.numPages) {
      throw new Error("The PDF contains no pages.");
    }

    showStatus("Reading the PDF…", "info");

    let text = await extractPdfText(pdf);
    let usedOCR = false;

    // If normal PDF text is missing or suspiciously short, use OCR.
    if (text.length < 80) {
      usedOCR = true;
      text = await ocrPdf(pdf);
    }

    if (!text.trim()) {
      throw new Error(
        "No readable text was found. The PDF may be damaged or use an unsupported format."
      );
    }

    setProgress(100);
    showStatus("Analysis complete.", "success");

    displayResult(file, text, usedOCR);

    setTimeout(hideProgress, 500);
  }

  function resetApp() {
    resultsBox.innerHTML = "";
    statusBox.className = "status";
    statusBox.textContent = "";
    hideProgress();
    pdfInput.value = "";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function handleFile(file) {
    if (!file) return;

    if (!file.name.toLowerCase().endsWith(".pdf")) {
      showStatus("Please select a PDF file.", "error");
      return;
    }

    try {
      await analyzePdf(file);
    } catch (error) {
      console.error(error);
      hideProgress();
      resultsBox.innerHTML = "";
      showStatus(
        "Something went wrong while analyzing the PDF.\n\n" +
        (error && error.message ? error.message : "Unknown error.") +
        "\n\nPlease try the PDF again. If it is a scanned PDF, SmartDoc will automatically use OCR.",
        "error"
      );
    }
  }

  // IMPORTANT: the upload input is permanently present.
  // Reloading the page therefore always restores the upload button.
  pdfInput.addEventListener("change", event => {
    const file = event.target.files && event.target.files[0];
    handleFile(file);
  });

  uploadBox.addEventListener("dragover", event => {
    event.preventDefault();
    uploadBox.classList.add("dragover");
  });

  uploadBox.addEventListener("dragleave", () => {
    uploadBox.classList.remove("dragover");
  });

  uploadBox.addEventListener("drop", event => {
    event.preventDefault();
    uploadBox.classList.remove("dragover");

    const file = event.dataTransfer.files && event.dataTransfer.files[0];
    handleFile(file);
  });

  // Keep the app clean after a browser reload.
  resetApp();
</script>
</body>
</html>
