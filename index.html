<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SmartDoc Organizer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 30px;
      color: #222;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .upload-box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      border: 2px dashed #bbb;
      text-align: center;
      margin-bottom: 20px;
    }

    input[type="file"] {
      margin-top: 15px;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 8px;
    }

    .document {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
      border: 1px solid #ddd;
    }

    .success {
      color: #16803c;
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 12px;
    }

    input,
    select {
      font-size: 15px;
    }

    button {
      font-size: 14px;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SmartDoc Organizer</h1>

  <div class="subtitle">
    Upload a document and SmartDoc will read, understand and organize it.
  </div>

  <div class="upload-box">

    <strong>Upload your PDF</strong>

    <br>

    <input
      type="file"
      id="fileInput"
      accept=".pdf"
    >

  </div>

  <div id="status" class="status">
    Ready to analyze a document.
  </div>

  <div id="results"></div>

</div>


<!-- Tesseract OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<script type="module">

  /*
   * PDF.js
   */

  import * as pdfjsLib from
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs";


  /*
   * Basic UI elements
   */

  const fileInput = document.getElementById("fileInput");
  const statusBox = document.getElementById("status");
  const resultsBox = document.getElementById("results");


  /*
   * Status message
   */

  function showStatus(message) {
    statusBox.textContent = message;
  }


  /*
   * Prevent HTML from being inserted accidentally
   */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
   * Load PDF
   */

  async function loadPDF(file) {

    const arrayBuffer = await file.arrayBuffer();

    const pdf = await pdfjsLib.getDocument({
      data: arrayBuffer
    }).promise;

    return pdf;

  }


  /*
   * Extract selectable text from PDF
   */

  async function extractPDFText(pdf) {

    let fullText = "";

    const pagesToRead = Math.min(pdf.numPages, 10);

    for (let pageNumber = 1; pageNumber <= pagesToRead; pageNumber++) {

      const page = await pdf.getPage(pageNumber);

      const content = await page.getTextContent();

      const pageText = content.items
        .map(item => item.str)
        .join(" ");

      fullText += "\n" + pageText;

    }

    return fullText;

  }


  /*
   * Render PDF page as an image
   */

  async function renderPage(pdf, pageNumber, scale = 2.5) {

    const page = await pdf.getPage(pageNumber);

    const viewport = page.getViewport({
      scale
    });

    const canvas = document.createElement("canvas");

    const context = canvas.getContext("2d");

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({
      canvasContext: context,
      viewport
    }).promise;

    return canvas;

  }


  /*
   * OCR scanned/image PDFs
   */

  async function runOCR(pdf) {

    let ocrText = "";

    const pagesToOCR = Math.min(pdf.numPages, 3);

    for (
      let pageNumber = 1;
      pageNumber <= pagesToOCR;
      pageNumber++
    ) {

      showStatus(
        `Reading page ${pageNumber} of ${pagesToOCR} with OCR...`
      );

      const canvas = await renderPage(
        pdf,
        pageNumber,
        2.5
      );

      const result = await Tesseract.recognize(
        canvas,
        "eng+fra",
        {
          logger: message => {

            if (message.status === "recognizing text") {

              const progress =
                Math.round(message.progress * 100);

              showStatus(
                `OCR reading page ${pageNumber}... ${progress}%`
              );

            }

          }
        }
      );

      ocrText += "\n" + result.data.text;

    }

    return ocrText;

  }


  /*
   * Clean text
   */

  function cleanText(text) {

    return text
      .replace(/\r/g, "\n")
      .replace(/[ \t]+/g, " ")
      .replace(/\n+/g, "\n")
      .trim();

  }


  /*
   * Detect document type
   */

  function detectDocumentType(text) {

    const lower = text.toLowerCase();

    if (
      lower.includes("invoice") ||
      lower.includes("facture") ||
      lower.includes("amount due") ||
      lower.includes("total ttc")
    ) {
      return "Invoice";
    }

    if (
      lower.includes("receipt") ||
      lower.includes("reçu") ||
      lower.includes("recu")
    ) {
      return "Receipt";
    }

    if (
      lower.includes("contract") ||
      lower.includes("contrat") ||
      lower.includes("agreement")
    ) {
      return "Contract";
    }

    if (
      lower.includes("curriculum vitae") ||
      lower.includes("resume") ||
      lower.includes("cv") ||
      lower.includes("expériences professionnelles") ||
      lower.includes("experiences professionnelles") ||
      lower.includes("education") ||
      lower.includes("formation")
    ) {
      return "Resume / CV";
    }

    if (
      lower.includes("marketing") ||
      lower.includes("campaign") ||
      lower.includes("campagne")
    ) {
      return "Marketing";
    }

    if (
      lower.includes("operations") ||
      lower.includes("opérations") ||
      lower.includes("procedure")
    ) {
      return "Operations";
    }

    return "Document";

  }


  /*
   * Extract email
   */

  function extractEmail(text) {

    const match = text.match(
      /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i
    );

    return match
      ? match[0]
      : "Not detected";

  }


  /*
   * Extract phone number
   */

  function extractPhone(text) {

    const matches = text.match(
      /(?:\+?\d[\d .()-]{7,}\d)/g
    );

    if (!matches) {
      return "Not detected";
    }

    return matches[0]
      .replace(/\s+/g, " ")
      .trim();

  }


  /*
   * Extract location
   */

  function extractLocation(text) {

    const locations = [
      "Marrakech",
      "Marrakesh",
      "Casablanca",
      "Rabat",
      "Agadir",
      "Tangier",
      "Tanger",
      "Fes",
      "Fez",
      "Meknes",
      "Morocco",
      "Maroc",
      "Paris",
      "London",
      "Madrid",
      "Barcelona"
    ];

    for (const location of locations) {

      if (
        text.toLowerCase()
          .includes(location.toLowerCase())
      ) {
        return location;
      }

    }

    return "Not detected";

  }


  /*
   * Extract profession
   */

  function extractProfession(text) {

    const professions = [

      {
        keywords: [
          "barman",
          "mixologist"
        ],
        name: "Barman / Mixologist"
      },

      {
        keywords: [
          "developer",
          "software engineer",
          "web developer"
        ],
        name: "Developer"
      },

      {
        keywords: [
          "accountant",
          "comptable"
        ],
        name: "Accountant"
      },

      {
        keywords: [
          "manager",
          "responsable"
        ],
        name: "Manager"
      },

      {
        keywords: [
          "designer",
          "graphic designer"
        ],
        name: "Designer"
      },

      {
        keywords: [
          "chef",
          "cook",
          "cuisinier"
        ],
        name: "Chef / Cook"
      }

    ];


    const lower = text.toLowerCase();

    for (const profession of professions) {

      for (const keyword of profession.keywords) {

        if (lower.includes(keyword)) {

          return profession.name;

        }

      }

    }

    return "Not detected";

  }


  /*
   * Extract languages
   */

  function extractLanguages(text) {

    const found = [];

    const languages = [
      "French",
      "Français",
      "English",
      "Anglais",
      "Arabic",
      "Arabe",
      "Spanish",
      "Espagnol",
      "German",
      "Allemand",
      "Italian",
      "Italien"
    ];


    for (const language of languages) {

      if (
        text.toLowerCase()
          .includes(language.toLowerCase())
      ) {

        let normalized = language;

        if (
          language === "Français" ||
          language === "French"
        ) {
          normalized = "French";
        }

        if (
          language === "Anglais" ||
          language === "English"
        ) {
          normalized = "English";
        }

        if (
          language === "Arabe" ||
          language === "Arabic"
        ) {
          normalized = "Arabic";
        }

        if (
          language === "Espagnol" ||
          language === "Spanish"
        ) {
          normalized = "Spanish";
        }

        if (!found.includes(normalized)) {
          found.push(normalized);
        }

      }

    }

    return found.length
      ? found.join(", ")
      : "Not detected";

  }


  /*
   * Extract birth date
   */

  function extractBirthDate(text) {

    const numericDate = text.match(
      /\b\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}\b/
    );

    if (numericDate) {
      return numericDate[0];
    }


    const monthDate = text.match(
      /\b\d{1,2}\s+(jan|janv|janvier|feb|févr|février|mar|mars|apr|avr|avril|may|mai|jun|juin|jul|juil|juillet|aug|août|sep|sept|septembre|oct|octobre|nov|novembre|dec|déc|décembre)\.?\s+\d{4}\b/i
    );

    if (monthDate) {
      return monthDate[0];
    }

    return "Not detected";

  }


  /*
   * Extract possible name
   */

  function extractName(text) {

    const lines = cleanText(text)
      .split("\n")
      .map(line => line.trim())
      .filter(Boolean);


    const blocked = [
      "curriculum",
      "vitae",
      "resume",
      "expériences",
      "experiences",
      "professionnelles",
      "education",
      "formation",
      "compétences",
      "competences",
      "languages",
      "langues",
      "contact",
      "profile",
      "profil",
      "email",
      "phone",
      "telephone",
      "nationalité",
      "nationalite",
      "date"
    ];


    for (const line of lines) {

      const lower = line.toLowerCase();

      if (
        blocked.some(word =>
          lower.includes(word)
        )
      ) {
        continue;
      }


      /*
       * Prefer lines that look like a person's name.
       */

      const words = line
        .replace(/[^A-Za-zÀ-ÿ' -]/g, " ")
        .split(/\s+/)
        .filter(Boolean);


      if (
        words.length >= 2 &&
        words.length <= 4
      ) {

        const goodWords = words.filter(word => {

          return (
            word.length >= 3 &&
            /^[A-Za-zÀ-ÿ]/.test(word)
          );

        });


        if (
          goodWords.length >= 2 &&
          goodWords.length === words.length
        ) {

          const result = goodWords.join(" ");

          /*
           * Ignore obvious section headings.
           */

          const resultLower =
            result.toLowerCase();

          if (
            !resultLower.includes("barman") &&
            !resultLower.includes("mixologue") &&
            !resultLower.includes("marrakech")
          ) {

            return result;

          }

        }

      }

    }


    /*
     * Try a line containing KHALID-style uppercase names.
     */

    for (const line of lines) {

      if (
        /^[A-ZÀ-Ÿ][A-ZÀ-Ÿ' -]{3,30}$/.test(line)
      ) {

        const lower = line.toLowerCase();

        if (
          !blocked.some(word =>
            lower.includes(word)
          )
        ) {

          return line;

        }

      }

    }


    return "Not detected";

  }


  /*
   * Create suggested filename
   */

  function makeFilename(
    type,
    name,
    profession,
    location
  ) {

    const parts = [];


    function addPart(value) {

      if (
        !value ||
        value === "Not detected"
      ) {
        return;
      }

      let cleaned = value
        .replace(/[^a-zA-Z0-9À-ÿ]+/g, "-")
        .replace(/^-+|-+$/g, "");

      if (cleaned) {
        parts.push(cleaned);
      }

    }


    addPart(name);
    addPart(profession);


    if (type && type !== "Document") {

      addPart(type);

    }


    addPart(location);


    if (parts.length === 0) {

      return "Organized-Document.pdf";

    }


    return parts.join("_") + ".pdf";

  }


  /*
   * Display intelligent result
   *
   * IMPORTANT:
   * The fields below are editable.
   */

  function displayResult(
    file,
    text,
    usedOCR
  ) {

    const clean = cleanText(text);


    let type =
      detectDocumentType(clean);

    let name =
      extractName(text);

    let profession =
      extractProfession(clean);

    let location =
      extractLocation(clean);

    let email =
      extractEmail(clean);

    let phone =
      extractPhone(clean);

    let languages =
      extractLanguages(clean);

    let birthDate =
      extractBirthDate(clean);


    resultsBox.innerHTML = "";


    const card =
      document.createElement("div");

    card.className =
      "document";


    card.innerHTML = `

      <div style="
        color:#16803c;
        font-weight:600;
        margin-bottom:18px;
      ">
        ✓ Document successfully analyzed
      </div>


      <div style="
        margin-bottom:20px;
      ">

        <strong>
          ${escapeHTML(file.name)}
        </strong>

        <div style="
          color:#666;
          font-size:14px;
          margin-top:5px;
        ">

          Analysis method:
          ${usedOCR ? "OCR" : "PDF text"}

        </div>

      </div>


      <label>
        <strong>Document type</strong>
      </label>

      <select
        id="editType"
        style="
          width:100%;
          padding:10px;
          margin:6px 0 14px;
          border:1px solid #ccc;
          border-radius:7px;
          box-sizing:border-box;
        "
      >

        <option
          ${type === "Resume / CV" ? "selected" : ""}
        >
          Resume / CV
        </option>

        <option
          ${type === "Invoice" ? "selected" : ""}
        >
          Invoice
        </option>

        <option
          ${type === "Receipt" ? "selected" : ""}
        >
          Receipt
        </option>

        <option
          ${type === "Contract" ? "selected" : ""}
        >
          Contract
        </option>

        <option
          ${type === "Marketing" ? "selected" : ""}
        >
          Marketing
        </option>

        <option
          ${type === "Operations" ? "selected" : ""}
        >
          Operations
        </option>

        <option
          ${type === "Document" ? "selected" : ""}
        >
          Document
        </option>

      </select>


      <label>
        <strong>Name</strong>
      </label>

      <input
        id="editName"
        value="${escapeHTML(name)}"
        style="
          width:100%;
          padding:10px;
          margin:6px 0 14px;
          border:1px solid #ccc;
          border-radius:7px;
          box-sizing:border-box;
        "
      >


      <label>
        <strong>Profession</strong>
      </label>

      <input
        id="editProfession"
        value="${escapeHTML(profession)}"
        style="
          width:100%;
          padding:10px;
          margin:6px 0 14px;
          border:1px solid #ccc;
          border-radius:7px;
          box-sizing:border-box;
        "
      >


      <label>
        <strong>Location</strong>
      </label>

      <input
        id="editLocation"
        value="${escapeHTML(location)}"
        style="
          width:100%;
          padding:10px;
          margin:6px 0 14px;
          border:1px solid #ccc;
          border-radius:7px;
          box-sizing:border-box;
        "
      >


      <label>
        <strong>Email</strong>
      </label>

      <input
        id="editEmail"
        value="${escapeHTML(email)}"
        style="
          width:100%;
          padding:10px;
          margin:6px 0 14px;
          border:1px solid #ccc;
          border-radius:7px;
          box-sizing:border-box;
        "
      >


      <label>
        <strong>Phone</strong>
      </label>

      <input
        id="editPhone"
        value="${escapeHTML(phone)}"
        style="
          width:100%;
          padding:10px;
          margin:6px 0 14px;
          border:1px solid #ccc;
          border-radius:7px;
          box-sizing:border-box;
        "
      >


      <label>
        <strong>Languages</strong>
      </label>

      <input
        id="editLanguages"
        value="${escapeHTML(languages)}"
        style="
          width:100%;
          padding:10px;
          margin:6px 0 14px;
          border:1px solid #ccc;
          border-radius:7px;
          box-sizing:border-box;
        "
      >


      <label>
        <strong>Birth date</strong>
      </label>

      <input
        id="editBirthDate"
        value="${escapeHTML(birthDate)}"
        style="
          width:100%;
          padding:10px;
          margin:6px 0 18px;
          border:1px solid #ccc;
          border-radius:7px;
          box-sizing:border-box;
        "
      >


      <div style="
        padding:15px;
        background:#f5f7fa;
        border-radius:8px;
        margin-top:10px;
      ">

        <strong>
          Suggested filename:
        </strong>

        <div
          id="suggestedFilename"
          style="
            margin-top:8px;
            font-family:monospace;
            word-break:break-word;
          "
        ></div>

      </div>


      <button
        id="copyFilename"
        style="
          margin-top:12px;
          padding:10px 15px;
          border:0;
          border-radius:7px;
          cursor:pointer;
        "
      >
        Copy filename
      </button>


      <details style="
        margin-top:20px;
      ">

        <summary>
          Show raw OCR text
        </summary>

        <pre style="
          white-space:pre-wrap;
          background:#f5f5f5;
          padding:12px;
          margin-top:10px;
          border-radius:7px;
          max-height:300px;
          overflow:auto;
        ">${escapeHTML(text)}</pre>

      </details>

    `;


    resultsBox.appendChild(card);


    /*
     * Find editable fields
     */

    const editType =
      card.querySelector("#editType");

    const editName =
      card.querySelector("#editName");

    const editProfession =
      card.querySelector("#editProfession");

    const editLocation =
      card.querySelector("#editLocation");

    const suggestedFilename =
      card.querySelector("#suggestedFilename");

    const copyFilename =
      card.querySelector("#copyFilename");


    /*
     * Update filename whenever
     * the user changes a field.
     */

    function updateFilename() {

      const filename =
        makeFilename(
          editType.value,
          editName.value,
          editProfession.value,
          editLocation.value
        );

      suggestedFilename.textContent =
        filename;

    }


    [
      editType,
      editName,
      editProfession,
      editLocation
    ].forEach(input => {

      input.addEventListener(
        "input",
        updateFilename
      );

    });


    /*
     * Copy filename button
     */

    copyFilename.addEventListener(
      "click",
      async () => {

        await navigator.clipboard.writeText(
          suggestedFilename.textContent
        );

        copyFilename.textContent =
          "✓ Copied";

        setTimeout(() => {

          copyFilename.textContent =
            "Copy filename";

        }, 1500);

      }
    );


    /*
     * Generate filename immediately.
     */

    updateFilename();

  }


  /*
   * Main file processing
   */

  async function processFile(file) {

    try {

      resultsBox.innerHTML = "";

      showStatus(
        "Opening PDF..."
      );


      const pdf =
        await loadPDF(file);


      showStatus(
        "Checking document text..."
      );


      let text =
        await extractPDFText(pdf);


      /*
       * If PDF contains almost no text,
       * treat it as a scanned/image PDF.
       */

      const usefulText =
        text.replace(/\s/g, "");


      let usedOCR = false;


      if (usefulText.length < 30) {

        usedOCR = true;

        showStatus(
          "This looks like a scanned PDF. Starting OCR..."
        );

        text =
          await runOCR(pdf);

      }


      if (!text.trim()) {

        throw new Error(
          "No readable text was found."
        );

      }


      showStatus(
        "Understanding document..."
      );


      displayResult(
        file,
        text,
        usedOCR
      );


      showStatus(
        "Finished analyzing " + file.name
      );


    } catch (error) {

      console.error(error);

      showStatus(
        "Something went wrong: " +
        error.message
      );

    }

  }


  /*
   * File upload event
   */

  fileInput.addEventListener(
    "change",
    async () => {

      const file =
        fileInput.files[0];

      if (!file) {
        return;
      }


      if (
        file.type !== "application/pdf"
      ) {

        showStatus(
          "Please upload a PDF file."
        );

        return;

      }


      await processFile(file);

    }
  );

</script>

</body>
</html>
