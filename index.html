<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SmartDoc Organizer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }

    header {
      background: white;
      padding: 20px 40px;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    main {
      max-width: 1000px;
      margin: 50px auto;
      padding: 20px;
    }

    .hero {
      text-align: center;
      margin-bottom: 40px;
    }

    .hero h2 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #667085;
      font-size: 18px;
    }

    .upload-box {
      background: white;
      border: 2px dashed #b8c2cc;
      border-radius: 16px;
      padding: 50px 30px;
      text-align: center;
    }

    input[type="file"] {
      margin-top: 20px;
    }

    button {
      margin-top: 20px;
      padding: 13px 25px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      opacity: 0.85;
    }

    #results {
      margin-top: 40px;
    }

    .category {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #e1e5e9;
    }

    .category h3 {
      margin-top: 0;
    }

    .file {
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
      margin-top: 8px;
    }

    .empty {
      text-align: center;
      color: #667085;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>📁 SmartDoc Organizer</h1>
</header>

<main>

  <section class="hero">
    <h2>Organize your documents automatically.</h2>

    <p>
      Upload your files and SmartDoc will categorize them for you.
    </p>
  </section>

  <section class="upload-box">

    <h3>Upload your documents</h3>

    <p>
      Select multiple documents from your computer.
    </p>

    <input
      type="file"
      id="fileInput"
      multiple
    >

    <br>

    <button onclick="organizeFiles()">
      Organize Documents
    </button>

  </section>

  <section id="results">

    <p class="empty">
      Your organized documents will appear here.
    </p>

  </section>

</main>

<script>

function categorizeFile(filename) {

  const name = filename.toLowerCase();

  // FINANCE
  if (
    name.includes("invoice") ||
    name.includes("receipt") ||
    name.includes("payment") ||
    name.includes("expense") ||
    name.includes("bill")
  ) {
    return "💰 Finance";
  }

  // HR
  if (
    name.includes("employee") ||
    name.includes("contract") ||
    name.includes("resume") ||
    name.includes("cv") ||
    name.includes("salary") ||
    name.includes("hr")
  ) {
    return "👥 Human Resources";
  }

  // LEGAL
  if (
    name.includes("legal") ||
    name.includes("agreement") ||
    name.includes("nda") ||
    name.includes("license") ||
    name.includes("terms")
  ) {
    return "⚖️ Legal";
  }

  // MARKETING
  if (
    name.includes("marketing") ||
    name.includes("campaign") ||
    name.includes("advert") ||
    name.includes("social") ||
    name.includes("promotion")
  ) {
    return "📣 Marketing";
  }

  // OPERATIONS
  if (
    name.includes("policy") ||
    name.includes("procedure") ||
    name.includes("report") ||
    name.includes("operations") ||
    name.includes("manual")
  ) {
    return "⚙️ Operations";
  }

  // DEFAULT
  return "📄 Other";
}


function organizeFiles() {

  const input = document.getElementById("fileInput");

  const results = document.getElementById("results");

  results.innerHTML = "";

  if (input.files.length === 0) {

    results.innerHTML =
      '<p class="empty">Please select some documents first.</p>';

    return;
  }

  const categories = {};

  for (const file of input.files) {

    const category = categorizeFile(file.name);

    if (!categories[category]) {
      categories[category] = [];
    }

    categories[category].push(file.name);
  }

  for (const category in categories) {

    const box = document.createElement("div");

    box.className = "category";

    const title = document.createElement("h3");

    title.textContent = category;

    box.appendChild(title);

    categories[category].forEach(function(filename) {

      const fileElement = document.createElement("div");

      fileElement.className = "file";

      fileElement.textContent = "📄 " + filename;

      box.appendChild(fileElement);

    });

    results.appendChild(box);
  }

}

</script>

</body>
</html>
