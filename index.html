<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SmartDoc Organizer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 34px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 30px;
    }

    .upload-box {
      background: white;
      border: 2px dashed #9ca3af;
      border-radius: 16px;
      padding: 50px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload-box:hover,
    .upload-box.dragover {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .upload-box strong {
      display: block;
      font-size: 20px;
      margin-bottom: 8px;
    }

    .upload-box span {
      color: #6b7280;
    }

    #fileInput {
      display: none;
    }

    .status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background: #eef2ff;
      color: #3730a3;
      display: none;
    }

    .results {
      margin-top: 30px;
    }

    .result-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .success {
      color: #15803d;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    .field input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.1);
    }

    .filename-preview {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 8px;
      font-family: monospace;
      word-break: break-word;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 8px;
      margin-top: 8px;
    }

    .primary-btn {
      background: #2563eb;
      color: white;
    }

    .primary-btn:hover {
      background: #1d4ed8;
    }

    .secondary-btn {
      background: #e5e7eb;
      color: #111827;
    }

    .secondary-btn:hover {
      background: #d1d5db;
    }

    .raw-text {
      margin-top: 20px;
      display: none;
    }

    .raw-text textarea {
      width: 100%;
      min-height: 220px;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-family: monospace;
      resize: vertical;
    }

    .small {
      font-size: 13px;
      color: #6b7280;
      margin-top: 8px;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
      border-radius: 10px;
      padding: 14px;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>SmartDoc Organizer</h1>

    <p class="subtitle">
      Upload a document and SmartDoc will read, understand and organize it.
    </p>

    <div
      class="upload-box"
      id="uploadBox"
    >
      <strong>Drop a PDF here or click to choose a PDF</strong>
      <span>
        SmartDoc can read normal PDFs and scanned PDFs using OCR.
      </span>

      <input
        type="file"
        id="fileInput"
        accept="application/pdf,.pdf"
      />
    </div>

    <div class="status" id="status"></div>

    <div class="error" id="errorBox"></div>

    <div class="results" id="results"></div>

  </div>


  <!-- OCR ENGINE -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


  <!--
    IMPORTANT:
    PDF.js and the application are inside the SAME module.
    This prevents the loading problem from the previous version.
  -->
  <script type="module">

    import * as pdfjsLib from
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs";


    // --------------------------------------------------
    // ELEMENTS
    // --------------------------------------------------

    const uploadBox = document.getElementById("uploadBox");
    const fileInput = document.getElementById("fileInput");
    const statusBox = document.getElementById("status");
    const errorBox = document.getElementById("errorBox");
    const results = document.getElementById("results");


    // --------------------------------------------------
    // CURRENT FILE
    // --------------------------------------------------

    let currentFile = null;


    // --------------------------------------------------
    // UPLOAD EVENTS
    // --------------------------------------------------

    uploadBox.addEventListener("click", () => {
      fileInput.click();
    });


    fileInput.addEventListener("change", () => {

      if (fileInput.files.length > 0) {
        handleFile(fileInput.files[0]);
      }

    });


    uploadBox.addEventListener("dragover", (event) => {

      event.preventDefault();

      uploadBox.classList.add("dragover");

    });


    uploadBox.addEventListener("dragleave", () => {

      uploadBox.classList.remove("dragover");

    });


    uploadBox.addEventListener("drop", (event) => {

      event.preventDefault();

      uploadBox.classList.remove("dragover");

      const files = event.dataTransfer.files;

      if (files.length > 0) {
        handleFile(files[0]);
      }

    });


    // --------------------------------------------------
    // HANDLE FILE
    // --------------------------------------------------

    async function handleFile(file) {

      hideError();

      results.innerHTML = "";

      currentFile = file;

      if (!file.name.toLowerCase().endsWith(".pdf")) {

        showError("Please upload a PDF file.");

        return;
      }


      try {

        showStatus("Loading PDF...");

        const arrayBuffer = await file.arrayBuffer();

        const pdf = await pdfjsLib.getDocument({
          data: arrayBuffer
        }).promise;


        showStatus(
          `PDF loaded successfully. ${pdf.numPages} page(s) found.`
        );


        // --------------------------------------------------
        // FIRST: TRY NORMAL PDF TEXT
        // --------------------------------------------------

        let extractedText = "";

        const pagesToRead = Math.min(pdf.numPages, 10);

        for (let pageNumber = 1; pageNumber <= pagesToRead; pageNumber++) {

          showStatus(
            `Reading PDF text... page ${pageNumber} of ${pagesToRead}`
          );

          const page = await pdf.getPage(pageNumber);

          const textContent = await page.getTextContent();

          const pageText = textContent.items
            .map(item => item.str || "")
            .join(" ");

          extractedText += "\n" + pageText;
        }


        extractedText = cleanText(extractedText);


        // --------------------------------------------------
        // IF PDF HAS VERY LITTLE TEXT -> OCR
        // --------------------------------------------------

        let usedOCR = false;

        if (extractedText.replace(/\s/g, "").length < 30) {

          usedOCR = true;

          showStatus(
            "This looks like a scanned PDF. Starting OCR..."
          );

          extractedText = await runOCR(pdf);

          extractedText = cleanText(extractedText);
        }


        if (!extractedText.trim()) {

          showError(
            "SmartDoc could not extract readable text from this PDF."
          );

          return;
        }


        displayResult(
          file,
          extractedText,
          usedOCR
        );


        showStatus("Document successfully analyzed.");

      } catch (error) {

        console.error(error);

        showError(
          "Something went wrong while analyzing the PDF. Please try again."
        );

      }

    }


    // --------------------------------------------------
    // OCR
    // --------------------------------------------------

    async function runOCR(pdf) {

      if (!window.Tesseract) {

        throw new Error(
          "Tesseract OCR did not load."
        );
      }


      let ocrText = "";

      const pagesToOCR = Math.min(pdf.numPages, 3);


      const worker = await Tesseract.createWorker(
        "eng",
        1,
        {
          logger: message => {

            if (
              message.status &&
              typeof message.progress === "number"
            ) {

              const percent =
                Math.round(message.progress * 100);

              showStatus(
                `OCR: ${message.status} — ${percent}%`
              );

            }

          }
        }
      );


      try {

        for (
          let pageNumber = 1;
          pageNumber <= pagesToOCR;
          pageNumber++
        ) {

          showStatus(
            `Preparing scanned page ${pageNumber} of ${pagesToOCR}...`
          );


          const page = await pdf.getPage(pageNumber);


          const viewport = page.getViewport({
            scale: 2.5
          });


          const canvas = document.createElement("canvas");

          const context = canvas.getContext("2d");


          canvas.width = viewport.width;
          canvas.height = viewport.height;


          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;


          showStatus(
            `OCR scanning page ${pageNumber} of ${pagesToOCR}...`
          );


          const result = await worker.recognize(canvas);

          ocrText += "\n" + result.data.text;


          canvas.width = 1;
          canvas.height = 1;
        }

      } finally {

        await worker.terminate();

      }


      return ocrText;

    }


    // --------------------------------------------------
    // CLEAN TEXT
    // --------------------------------------------------

    function cleanText(text) {

      return text
        .replace(/\r/g, "\n")
        .replace(/[ \t]+/g, " ")
        .replace(/\n\s*\n\s*\n+/g, "\n\n")
        .trim();

    }


    // --------------------------------------------------
    // DOCUMENT TYPE
    // --------------------------------------------------

    function detectDocumentType(text) {

      const lower =
        text.toLowerCase()
          .replace(/\s+/g, " ")
          .trim();


      // INVOICE

      if (
        /\binvoice\s*(number|no|#|date)?\b/i.test(lower) ||
        /\bfacture\s*(n°|no|numero|numéro|date)?\b/i.test(lower) ||
        /\btotal\s+(due|amount|ttc)\b/i.test(lower)
      ) {

        return "Invoice";
      }


      // RECEIPT

      if (
        /\breceipt\b/i.test(lower) ||
        /\breçu\b/i.test(lower) ||
        /\bticket\s+de\s+caisse\b/i.test(lower)
      ) {

        return "Receipt";
      }


      // RESUME / CV

      const resumeSignals = [

        /\bresume\b/i,
        /\bcurriculum vitae\b/i,
        /\bresume samples\b/i,
        /\bwork history\b/i,
        /\bprofessional accomplishments\b/i,
        /\bprofessional experience\b/i,
        /\bprofessional experiences\b/i,
        /\bexperiences professionnelles\b/i,
        /\beducation\b/i,
        /\bsummary of qualifications\b/i,
        /\bcompétences\b/i,
        /\blangues\b/i

      ];


      let resumeScore = 0;

      for (const signal of resumeSignals) {

        if (signal.test(lower)) {
          resumeScore++;
        }

      }


      if (resumeScore >= 2) {

        return "Resume / CV";
      }


      // CONTRACT

      const contractSignals = [

        /\bcontract\b/i,
        /\bagreement\b/i,
        /\bcontrat\b/i,
        /\bparties\b.*\bagree\b/i,
        /\bterms and conditions\b/i,
        /\bsignature\b.*\bdate\b/i

      ];


      let contractScore = 0;

      for (const signal of contractSignals) {

        if (signal.test(lower)) {
          contractScore++;
        }

      }


      if (contractScore >= 2) {

        return "Contract";
      }


      // MARKETING

      if (
        /\bmarketing campaign\b/i.test(lower) ||
        /\bmarketing plan\b/i.test(lower) ||
        /\bcampagne marketing\b/i.test(lower)
      ) {

        return "Marketing";
      }


      // OPERATIONS

      if (
        /\boperations report\b/i.test(lower) ||
        /\boperations manual\b/i.test(lower) ||
        /\bprocédure opérationnelle\b/i.test(lower)
      ) {

        return "Operations";
      }


      return "Document";

    }


    // --------------------------------------------------
    // FIELD EXTRACTION
    // --------------------------------------------------

    function extractEmail(text) {

      const match = text.match(
        /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i
      );

      return match ? match[0] : "";

    }


    function extractPhone(text) {

      const matches = text.match(
        /(?:\+?\d[\d\s().-]{7,}\d)/g
      );


      if (!matches) {
        return "";
      }


      return matches
        .map(value => value.trim())
        .find(value => value.replace(/\D/g, "").length >= 8) || "";

    }


    function extractLocation(text) {

      const lower = text.toLowerCase();


      const locations = [

        "Marrakech",
        "Marrakesh",
        "Casablanca",
        "Rabat",
        "Agadir",
        "Tangier",
        "Fes",
        "Fez",
        "Meknes",
        "Oujda",
        "Paris",
        "London",
        "New York",
        "Dubai",
        "Bellevue",
        "Nebraska"

      ];


      for (const location of locations) {

        if (
          lower.includes(location.toLowerCase())
        ) {

          return location;
        }

      }


      return "";

    }


    function extractProfession(text) {

      const lower = text.toLowerCase();


      const professions = [

        {
          keywords: [
            "barman",
            "mixologue",
            "mixologist"
          ],
          name: "Barman / Mixologist"
        },

        {
          keywords: [
            "manager",
            "management"
          ],
          name: "Manager"
        },

        {
          keywords: [
            "developer",
            "software engineer",
            "web developer"
          ],
          name: "Developer"
        },

        {
          keywords: [
            "accountant",
            "comptable"
          ],
          name: "Accountant"
        },

        {
          keywords: [
            "designer",
            "graphic designer"
          ],
          name: "Designer"
        },

        {
          keywords: [
            "sales",
            "commercial"
          ],
          name: "Sales"
        },

        {
          keywords: [
            "marketing"
          ],
          name: "Marketing"
        }

      ];


      for (const profession of professions) {

        for (const keyword of profession.keywords) {

          if (
            lower.includes(keyword)
          ) {

            return profession.name;
          }

        }

      }


      return "";

    }


    function extractName(text) {

      const lines = text
        .split("\n")
        .map(line => line.trim())
        .filter(Boolean);


      const blockedWords = [

        "resume",
        "curriculum",
        "vitae",
        "education",
        "experience",
        "experiences",
        "professional",
        "skills",
        "compétences",
        "langues",
        "languages",
        "contact",
        "phone",
        "email",
        "address",
        "barman",
        "mixologist",
        "manager",
        "sample"

      ];


      for (
        let i = 0;
        i < Math.min(lines.length, 20);
        i++
      ) {

        const line = lines[i];


        if (line.length < 3 || line.length > 50) {
          continue;
        }


        if (/@/.test(line)) {
          continue;
        }


        if (/\d/.test(line)) {
          continue;
        }


        const lower = line.toLowerCase();


        if (
          blockedWords.some(word =>
            lower.includes(word)
          )
        ) {

          continue;
        }


        const words = line.split(/\s+/);


        if (
          words.length >= 2 &&
          words.length <= 5
        ) {

          return line;
        }

      }


      return "";

    }


    // --------------------------------------------------
    // FILENAME
    // --------------------------------------------------

    function safeFilenamePart(value) {

      return value
        .trim()
        .replace(/[<>:"/\\|?*]+/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "");

    }


    function generateFilename(
      type,
      name,
      profession,
      location
    ) {

      const parts = [];


      if (name) {
        parts.push(
          safeFilenamePart(name)
        );
      }


      if (profession) {
        parts.push(
          safeFilenamePart(profession)
        );
      }


      if (type) {

        parts.push(
          safeFilenamePart(type)
        );

      }


      if (location) {

        parts.push(
          safeFilenamePart(location)
        );

      }


      if (parts.length === 0) {

        return "Organized-Document.pdf";
      }


      return parts.join("_") + ".pdf";

    }


    // --------------------------------------------------
    // DISPLAY RESULT
    // --------------------------------------------------

    function displayResult(
      file,
      text,
      usedOCR
    ) {

      const type =
        detectDocumentType(text);


      const name =
        extractName(text);


      const profession =
        extractProfession(text);


      const location =
        extractLocation(text);


      const email =
        extractEmail(text);


      const phone =
        extractPhone(text);


      const suggestedFilename =
        generateFilename(
          type,
          name,
          profession,
          location
        );


      const resultCard =
        document.createElement("div");

      resultCard.className =
        "result-card";


      const success =
        document.createElement("div");

      success.className =
        "success";

      success.textContent =
        "✓ Document successfully analyzed";

      resultCard.appendChild(success);


      // METHOD

      const method =
        document.createElement("div");

      method.className =
        "small";

      method.textContent =
        "Analysis method: " +
        (usedOCR ? "OCR" : "PDF text");

      resultCard.appendChild(method);


      resultCard.appendChild(
        createEditableField(
          "Document type",
          type
        )
      );


      resultCard.appendChild(
        createEditableField(
          "Name",
          name
        )
      );


      resultCard.appendChild(
        createEditableField(
          "Profession",
          profession
        )
      );


      resultCard.appendChild(
        createEditableField(
          "Location",
          location
        )
      );


      resultCard.appendChild(
        createEditableField(
          "Email",
          email
        )
      );


      resultCard.appendChild(
        createEditableField(
          "Phone",
          phone
        )
      );


      // FILENAME SECTION

      const filenameField =
        document.createElement("div");

      filenameField.className =
        "field";


      const filenameLabel =
        document.createElement("label");

      filenameLabel.textContent =
        "Suggested filename";

      filenameField.appendChild(
        filenameLabel
      );


      const filenameInput =
        document.createElement("input");

      filenameInput.type =
        "text";

      filenameInput.value =
        suggestedFilename;

      filenameInput.id =
        "filenameInput";

      filenameField.appendChild(
        filenameInput
      );


      resultCard.appendChild(
        filenameField
      );


      // DOWNLOAD BUTTON

      const downloadButton =
        document.createElement("button");

      downloadButton.className =
        "primary-btn";

      downloadButton.textContent =
        "Download organized PDF";


      downloadButton.addEventListener(
        "click",
        () => {

          downloadOrganizedFile(
            filenameInput.value
          );

        }
      );


      resultCard.appendChild(
        downloadButton
      );


      // COPY BUTTON

      const copyButton =
        document.createElement("button");

      copyButton.className =
        "secondary-btn";

      copyButton.textContent =
        "Copy filename";


      copyButton.addEventListener(
        "click",
        async () => {

          try {

            await navigator.clipboard.writeText(
              filenameInput.value
            );

            copyButton.textContent =
              "Copied!";

            setTimeout(() => {

              copyButton.textContent =
                "Copy filename";

            }, 1500);

          } catch {

            alert(
              "Could not copy automatically. Please select the filename and copy it manually."
            );

          }

        }
      );


      resultCard.appendChild(
        copyButton
      );


      // RAW TEXT

      const rawSection =
        document.createElement("div");

      rawSection.className =
        "raw-text";


      const rawLabel =
        document.createElement("div");

      rawLabel.className =
        "small";

      rawLabel.textContent =
        `Extracted text (${text.length} characters)`;

      rawSection.appendChild(
        rawLabel
      );


      const rawTextarea =
        document.createElement("textarea");

      rawTextarea.readOnly =
        true;

      rawTextarea.value =
        text;

      rawSection.appendChild(
        rawTextarea
      );


      resultCard.appendChild(
        rawSection
      );


      const rawButton =
        document.createElement("button");

      rawButton.className =
        "secondary-btn";

      rawButton.textContent =
        "Show extracted text";


      rawButton.addEventListener(
        "click",
        () => {

          if (
            rawSection.style.display ===
            "block"
          ) {

            rawSection.style.display =
              "none";

            rawButton.textContent =
              "Show extracted text";

          } else {

            rawSection.style.display =
              "block";

            rawButton.textContent =
              "Hide extracted text";

          }

        }
      );


      resultCard.appendChild(
        rawButton
      );


      results.appendChild(
        resultCard
      );

    }


    // --------------------------------------------------
    // EDITABLE FIELD
    // --------------------------------------------------

    function createEditableField(
      labelText,
      value
    ) {

      const field =
        document.createElement("div");

      field.className =
        "field";


      const label =
        document.createElement("label");

      label.textContent =
        labelText;


      const input =
        document.createElement("input");

      input.type =
        "text";

      input.value =
        value || "";


      field.appendChild(label);

      field.appendChild(input);


      return field;

    }


    // --------------------------------------------------
    // DOWNLOAD
    // --------------------------------------------------

    function downloadOrganizedFile(
      filename
    ) {

      if (!currentFile) {

        showError(
          "There is no PDF available to download."
        );

        return;
      }


      let cleanFilename =
        filename.trim();


      if (!cleanFilename) {

        cleanFilename =
          "Organized-Document.pdf";
      }


      if (
        !cleanFilename
          .toLowerCase()
          .endsWith(".pdf")
      ) {

        cleanFilename += ".pdf";
      }


      cleanFilename =
        cleanFilename
          .replace(/[<>:"/\\|?*]+/g, "")
          .trim();


      const url =
        URL.createObjectURL(
          currentFile
        );


      const link =
        document.createElement("a");


      link.href =
        url;

      link.download =
        cleanFilename;


      document.body.appendChild(
        link
      );


      link.click();


      link.remove();


      setTimeout(() => {

        URL.revokeObjectURL(url);

      }, 1000);

    }


    // --------------------------------------------------
    // STATUS
    // --------------------------------------------------

    function showStatus(message) {

      statusBox.style.display =
        "block";

      statusBox.textContent =
        message;

    }


    function showError(message) {

      errorBox.style.display =
        "block";

      errorBox.textContent =
        message;

    }


    function hideError() {

      errorBox.style.display =
        "none";

      errorBox.textContent =
        "";

    }

  </script>

</body>
</html>
