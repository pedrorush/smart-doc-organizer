<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SmartDoc Organizer</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 40px 20px;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .upload-box {
      background: white;
      border: 2px dashed #999;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      margin-bottom: 25px;
    }

    .upload-box:hover {
      border-color: #333;
    }

    input[type="file"] {
      margin-top: 20px;
    }

    #status {
      background: white;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
    }

    .document {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .document h2 {
      margin-top: 0;
    }

    .category {
      display: inline-block;
      background: #e9ecef;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .field {
      margin: 10px 0;
    }

    .label {
      font-weight: bold;
    }

    .filename {
      background: #f0f2f4;
      padding: 12px;
      border-radius: 6px;
      margin-top: 8px;
      font-family: monospace;
      word-break: break-word;
    }

    .raw-text {
      background: #f8f8f8;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      margin-top: 20px;
      max-height: 300px;
      overflow: auto;
      font-size: 13px;
    }

    .success {
      padding: 10px;
      background: #eef7ee;
      border-radius: 8px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SmartDoc Organizer</h1>

  <div class="subtitle">
    Upload a document and SmartDoc will read, understand and organize it.
  </div>

  <div class="upload-box">

    <strong>Upload your PDF</strong>

    <br><br>

    <input
      type="file"
      id="fileInput"
      accept=".pdf"
    >

  </div>

  <div id="status"></div>

  <div id="results"></div>

</div>


<script type="module">

  import * as pdfjsLib from
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs";


  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs";


  const fileInput =
    document.getElementById("fileInput");

  const statusBox =
    document.getElementById("status");

  const resultsBox =
    document.getElementById("results");


  function showStatus(message) {

    statusBox.style.display = "block";

    statusBox.innerHTML = message;

  }


  function escapeHTML(text) {

    return String(text || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  async function loadPDF(file) {

    const buffer =
      await file.arrayBuffer();

    return await pdfjsLib
      .getDocument({
        data: buffer
      })
      .promise;

  }


  async function extractPDFText(pdf) {

    let text = "";

    const pages =
      Math.min(pdf.numPages, 10);


    for (
      let pageNumber = 1;
      pageNumber <= pages;
      pageNumber++
    ) {

      showStatus(
        "Reading PDF text... " +
        pageNumber +
        " of " +
        pages
      );


      const page =
        await pdf.getPage(pageNumber);


      const content =
        await page.getTextContent();


      const pageText =
        content.items
          .map(item => item.str)
          .join(" ");


      text += "\n" + pageText;

    }


    return text.trim();

  }


  async function renderPage(pdf, pageNumber) {

    const page =
      await pdf.getPage(pageNumber);


    const viewport =
      page.getViewport({
        scale: 2.5
      });


    const canvas =
      document.createElement("canvas");


    const context =
      canvas.getContext("2d");


    canvas.width =
      viewport.width;

    canvas.height =
      viewport.height;


    await page.render({

      canvasContext: context,

      viewport: viewport

    }).promise;


    return canvas;

  }


  async function runOCR(pdf) {

    showStatus(
      "Scanned document detected.<br>" +
      "Starting OCR..."
    );


    const worker =
      await Tesseract.createWorker(
        "eng",
        1,
        {
          logger: function(message) {

            if (message.status) {

              const progress =
                message.progress
                  ? Math.round(
                      message.progress * 100
                    )
                  : 0;


              showStatus(
                message.status +
                "<br>" +
                progress +
                "%"
              );

            }

          }
        }
      );


    let text = "";

    const pages =
      Math.min(pdf.numPages, 3);


    for (
      let pageNumber = 1;
      pageNumber <= pages;
      pageNumber++
    ) {

      showStatus(
        "OCR reading page " +
        pageNumber +
        " of " +
        pages +
        "..."
      );


      const canvas =
        await renderPage(
          pdf,
          pageNumber
        );


      const result =
        await worker.recognize(
          canvas
        );


      text +=
        "\n" +
        result.data.text;

    }


    await worker.terminate();


    return text.trim();

  }


  function cleanText(text) {

    return text
      .replace(/\s+/g, " ")
      .trim();

  }


  function detectDocumentType(text) {

    const lower =
      text.toLowerCase();


    const scores = {

      "Resume / CV": 0,

      "Invoice": 0,

      "Receipt": 0,

      "Contract": 0,

      "Purchase Order": 0,

      "Marketing": 0,

      "Other": 0

    };


    const rules = {

      "Resume / CV": [
        "curriculum vitae",
        "resume",
        "professional experience",
        "work experience",
        "education",
        "skills",
        "languages",
        "experience professionnelle",
        "formation",
        "compétences",
        "langues"
      ],

      "Invoice": [
        "invoice",
        "invoice number",
        "amount due",
        "subtotal",
        "tax",
        "facture",
        "tva",
        "montant"
      ],

      "Receipt": [
        "receipt",
        "ticket",
        "total paid",
        "payment received",
        "reçu"
      ],

      "Contract": [
        "contract",
        "agreement",
        "terms and conditions",
        "signature",
        "contrat",
        "accord"
      ],

      "Purchase Order": [
        "purchase order",
        "po number",
        "order number",
        "bon de commande"
      ],

      "Marketing": [
        "marketing",
        "campaign",
        "advertising",
        "promotion",
        "publicité"
      ]

    };


    for (const category in rules) {

      for (const keyword of rules[category]) {

        if (lower.includes(keyword)) {

          scores[category]++;

        }

      }

    }


    let bestCategory =
      "Other";

    let bestScore =
      0;


    for (const category in scores) {

      if (
        category !== "Other" &&
        scores[category] > bestScore
      ) {

        bestCategory =
          category;

        bestScore =
          scores[category];

      }

    }


    return bestCategory;

  }


  function extractEmail(text) {

    const match =
      text.match(
        /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i
      );


    return match
      ? match[0]
      : "Not detected";

  }


  function extractPhone(text) {

    const match =
      text.match(
        /(?:\+?\d[\d\s().-]{7,}\d)/
      );


    return match
      ? match[0].trim()
      : "Not detected";

  }


  function extractLocation(text) {

    const lower =
      text.toLowerCase();


    const cities = [
      "Marrakech",
      "Casablanca",
      "Rabat",
      "Agadir",
      "Tangier",
      "Fes",
      "Meknes",
      "Paris",
      "London",
      "Madrid",
      "Barcelona",
      "Dubai"
    ];


    for (const city of cities) {

      if (
        lower.includes(
          city.toLowerCase()
        )
      ) {

        return city;

      }

    }


    return "Not detected";

  }


  function extractName(text) {

    const lines =
      text
        .split(/\n+/)
        .map(line =>
          line.trim()
        )
        .filter(line =>
          line.length > 2
        );


    const blockedWords = [
      "experience",
      "experiences",
      "education",
      "formation",
      "skills",
      "compétences",
      "languages",
      "langues",
      "profil",
      "profile",
      "professional",
      "informations",
      "personnelles"
    ];


    for (const line of lines) {

      const clean =
        line.replace(
          /[^A-Za-zÀ-ÿ' -]/g,
          ""
        ).trim();


      const words =
        clean.split(/\s+/);


      if (
        words.length >= 2 &&
        words.length <= 4 &&
        clean.length <= 50
      ) {

        const lower =
          clean.toLowerCase();


        const blocked =
          blockedWords.some(word =>
            lower.includes(word)
          );


        if (!blocked) {

          const looksLikeName =
            words.every(word =>
              /^[A-ZÀ-Ý][A-Za-zÀ-ÿ'-]*$/
                .test(word)
            );


          if (looksLikeName) {

            return clean;

          }

        }

      }

    }


    return "Not detected";

  }


  function extractProfession(text) {

    const lower =
      text.toLowerCase();


    const professions = [

      {
        name: "Barman / Mixologist",
        keywords: [
          "barman",
          "mixologue",
          "mixologist"
        ]
      },

      {
        name: "Chef",
        keywords: [
          "chef cuisinier",
          "chef de cuisine"
        ]
      },

      {
        name: "Waiter / Server",
        keywords: [
          "waiter",
          "serveur",
          "serveuse"
        ]
      },

      {
        name: "Manager",
        keywords: [
          "manager",
          "management"
        ]
      },

      {
        name: "Accountant",
        keywords: [
          "accountant",
          "comptable"
        ]
      },

      {
        name: "Developer",
        keywords: [
          "developer",
          "développeur",
          "software engineer"
        ]
      }

    ];


    for (
      const profession of professions
    ) {

      for (
        const keyword of profession.keywords
      ) {

        if (
          lower.includes(keyword)
        ) {

          return profession.name;

        }

      }

    }


    return "Not detected";

  }


  function extractLanguages(text) {

    const lower =
      text.toLowerCase();


    const languages = [];


    const possibleLanguages = [
      "French",
      "English",
      "Arabic",
      "Spanish",
      "German",
      "Italian",
      "French",
      "Français",
      "Anglais",
      "Arabe"
    ];


    for (
      const language of possibleLanguages
    ) {

      if (
        lower.includes(
          language.toLowerCase()
        )
      ) {

        if (
          !languages.includes(language)
        ) {

          languages.push(language);

        }

      }

    }


    return languages.length
      ? languages.join(", ")
      : "Not detected";

  }


  function extractBirthDate(text) {

    const patterns = [

      /\b\d{1,2}\s+(?:janv(?:ier)?|févr(?:ier)?|mars|avr(?:il)?|mai|juin|juil(?:let)?|août|sept(?:embre)?|oct(?:obre)?|nov(?:embre)?|déc(?:embre)?)\s+\d{4}\b/i,

      /\b\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}\b/

    ];


    for (
      const pattern of patterns
    ) {

      const match =
        text.match(pattern);


      if (match) {

        return match[0];

      }

    }


    return "Not detected";

  }


  function makeFilename(
    type,
    name,
    profession,
    location
  ) {

    let parts = [];


    if (
      name !== "Not detected"
    ) {

      parts.push(
        name.replace(
          /[^A-Za-z0-9À-ÿ]+/g,
          "-"
        )
      );

    }


    if (
      profession !== "Not detected"
    ) {

      parts.push(
        profession.replace(
          /[^A-Za-z0-9À-ÿ]+/g,
          "-"
        )
      );

    }


    if (
      type === "Resume / CV"
    ) {

      parts.push("CV");

    } else {

      parts.push(
        type.replace(
          /[^A-Za-z0-9]+/g,
          "-"
        )
      );

    }


    if (
      location !== "Not detected"
    ) {

      parts.push(
        location
      );

    }


    if (!parts.length) {

      parts.push("Document");

    }


    return parts.join("_") + ".pdf";

  }


  function displayResult(
    file,
    text,
    usedOCR
  ) {

    const clean =
      cleanText(text);


    const type =
      detectDocumentType(clean);


    const name =
      extractName(text);


    const profession =
      extractProfession(clean);


    const location =
      extractLocation(clean);


    const email =
      extractEmail(clean);


    const phone =
      extractPhone(clean);


    const languages =
      extractLanguages(clean);


    const birthDate =
      extractBirthDate(clean);


    const filename =
      makeFilename(
        type,
        name,
        profession,
        location
      );


    resultsBox.innerHTML = "";


    const card =
      document.createElement("div");


    card.className =
      "document";


    card.innerHTML = `

      <div class="success">
        ✓ Document successfully analyzed
      </div>

      <span class="category">
        ${escapeHTML(type)}
      </span>

      <h2>
        ${escapeHTML(file.name)}
      </h2>

      <div class="field">
        <span class="label">
          Analysis method:
        </span>
        ${usedOCR ? "OCR" : "PDF text"}
      </div>

      <hr>

      <div class="field">
        <span class="label">
          Document type:
        </span>
        ${escapeHTML(type)}
      </div>

      <div class="field">
        <span class="label">
          Name:
        </span>
        ${escapeHTML(name)}
      </div>

      <div class="field">
        <span class="label">
          Profession:
        </span>
        ${escapeHTML(profession)}
      </div>

      <div class="field">
        <span class="label">
          Location:
        </span>
        ${escapeHTML(location)}
      </div>

      <div class="field">
        <span class="label">
          Email:
        </span>
        ${escapeHTML(email)}
      </div>

      <div class="field">
        <span class="label">
          Phone:
        </span>
        ${escapeHTML(phone)}
      </div>

      <div class="field">
        <span class="label">
          Languages:
        </span>
        ${escapeHTML(languages)}
      </div>

      <div class="field">
        <span class="label">
          Birth date:
        </span>
        ${escapeHTML(birthDate)}
      </div>

      <hr>

      <div class="field">
        <span class="label">
          Suggested filename:
        </span>
      </div>

      <div class="filename">
        ${escapeHTML(filename)}
      </div>

      <details style="margin-top:20px">

        <summary>
          Show raw OCR text
        </summary>

        <div class="raw-text">
          ${escapeHTML(text)}
        </div>

      </details>

    `;


    resultsBox.appendChild(card);

  }


  fileInput.addEventListener(
    "change",
    async function() {

      const file =
        fileInput.files[0];


      if (!file) {

        return;

      }


      try {

        resultsBox.innerHTML = "";


        showStatus(
          "Loading document..."
        );


        const pdf =
          await loadPDF(file);


        let text =
          await extractPDFText(pdf);


        let usedOCR =
          false;


        if (
          !text ||
          text.replace(/\s/g, "").length < 30
        ) {

          usedOCR =
            true;


          text =
            await runOCR(pdf);

        }


        displayResult(
          file,
          text,
          usedOCR
        );


        showStatus(
          "Finished analyzing " +
          file.name
        );


      } catch (error) {

        console.error(error);


        showStatus(
          "<strong>Error:</strong><br>" +
          escapeHTML(
            error.message
          )
        );

      }

    }
  );

</script>

</body>
</html>
