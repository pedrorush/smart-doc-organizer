<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartDoc Organizer</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- Tesseract OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px 20px;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f7fa;
  color: #222;
}

.container {
  max-width: 900px;
  margin: 0 auto;
}

h1 {
  margin-bottom: 8px;
}

.subtitle {
  color: #666;
  margin-bottom: 25px;
}

.upload-box {
  background: white;
  border: 2px dashed #999;
  border-radius: 12px;
  padding: 40px 25px;
  text-align: center;
  margin-bottom: 25px;
  transition: 0.2s;
}

.upload-box.dragover {
  border-color: #2563eb;
  background: #eff6ff;
}

.upload-box p {
  margin: 8px 0;
}

#fileInput {
  display: none;
}

.upload-button {
  display: inline-block;
  margin-top: 15px;
  padding: 12px 22px;
  border: 0;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.upload-button:hover {
  background: #1d4ed8;
}

#status {
  margin: 20px 0;
  padding: 15px;
  border-radius: 8px;
  display: none;
}

.status-info {
  display: block !important;
  background: #eef6ff;
  color: #174ea6;
}

.status-success {
  display: block !important;
  background: #ecfdf5;
  color: #166534;
}

.status-error {
  display: block !important;
  background: #fef2f2;
  color: #991b1b;
}

.document {
  background: white;
  border-radius: 12px;
  padding: 25px;
  margin-top: 20px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

.success-title {
  color: #15803d;
  margin-top: 0;
}

.method {
  color: #666;
  font-size: 14px;
}

.field {
  margin: 15px 0;
}

.field label {
  display: block;
  font-weight: bold;
  margin-bottom: 6px;
}

.field input {
  width: 100%;
  padding: 11px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 15px;
}

.field input:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 2px rgba(37,99,235,0.1);
}

.filename-box {
  margin-top: 25px;
  padding: 18px;
  background: #f8fafc;
  border-radius: 8px;
  border: 1px solid #e2e8f0;
}

.filename {
  margin-top: 8px;
  font-family: monospace;
  word-break: break-all;
}

.copy-button {
  margin-top: 12px;
  padding: 10px 16px;
  border: 0;
  border-radius: 7px;
  background: #111827;
  color: white;
  cursor: pointer;
}

.copy-button:hover {
  background: #374151;
}

details {
  margin-top: 25px;
}

summary {
  cursor: pointer;
  font-weight: bold;
}

pre {
  margin-top: 12px;
  padding: 15px;
  background: #111827;
  color: #e5e7eb;
  border-radius: 8px;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 13px;
}

.progress {
  margin-top: 15px;
  height: 8px;
  background: #e5e7eb;
  border-radius: 20px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #2563eb;
  transition: width 0.2s;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="container">

  <h1>SmartDoc Organizer</h1>

  <div class="subtitle">
    Upload a document and SmartDoc will read, understand and organize it.
  </div>

  <div
    class="upload-box"
    id="uploadBox"
  >

    <strong>Drop a PDF here</strong>

    <p>or</p>

    <label for="fileInput" class="upload-button">
      Click to choose a PDF
    </label>

    <input
      id="fileInput"
      type="file"
      accept="application/pdf,.pdf"
    >

    <p style="margin-top:20px;color:#777;font-size:14px;">
      SmartDoc can read normal PDFs and scanned PDFs using OCR.
    </p>

  </div>

  <div id="status"></div>

  <div id="resultsBox"></div>

</div>


<script>

/* =========================================================
   SMARTDOC ORGANIZER
   ========================================================= */

const fileInput = document.getElementById("fileInput");
const uploadBox = document.getElementById("uploadBox");
const statusBox = document.getElementById("status");
const resultsBox = document.getElementById("resultsBox");


/* ---------------------------------------------------------
   PDF.JS WORKER
   --------------------------------------------------------- */

if (window.pdfjsLib) {

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

}


/* ---------------------------------------------------------
   STATUS
   --------------------------------------------------------- */

function showStatus(message, type = "info") {

  statusBox.textContent = message;

  statusBox.className = "";

  if (type === "success") {
    statusBox.classList.add("status-success");
  } else if (type === "error") {
    statusBox.classList.add("status-error");
  } else {
    statusBox.classList.add("status-info");
  }
}


function clearStatus() {

  statusBox.textContent = "";
  statusBox.className = "";

}


/* ---------------------------------------------------------
   CLEAN TEXT
   --------------------------------------------------------- */

function cleanText(text) {

  if (!text) return "";

  return text
    .replace(/\u0000/g, " ")
    .replace(/\r/g, "\n")
    .replace(/[ \t]+/g, " ")
    .replace(/\n\s+/g, "\n")
    .replace(/\n{3,}/g, "\n\n")
    .trim();

}


/* ---------------------------------------------------------
   NORMALIZE
   --------------------------------------------------------- */

function normalizeText(text) {

  return (text || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();

}


/* ---------------------------------------------------------
   DOCUMENT TYPE
   --------------------------------------------------------- */

function detectDocumentType(text) {

  const t = normalizeText(text);

  if (
    t.includes("resume") ||
    t.includes("curriculum vitae") ||
    t.includes("cv") ||
    t.includes("experience professionnelle") ||
    t.includes("professional experience") ||
    t.includes("work experience") ||
    t.includes("education") ||
    t.includes("formation") ||
    t.includes("competences") ||
    t.includes("skills")
  ) {
    return "Resume / CV";
  }

  if (
    t.includes("invoice") ||
    t.includes("facture") ||
    t.includes("total due") ||
    t.includes("amount due")
  ) {
    return "Invoice";
  }

  if (
    t.includes("receipt") ||
    t.includes("recu") ||
    t.includes("reçu")
  ) {
    return "Receipt";
  }

  if (
    t.includes("contract") ||
    t.includes("contrat") ||
    t.includes("agreement")
  ) {
    return "Contract";
  }

  if (
    t.includes("marketing") ||
    t.includes("campaign") ||
    t.includes("promotion")
  ) {
    return "Marketing";
  }

  if (
    t.includes("operations") ||
    t.includes("procedure") ||
    t.includes("process")
  ) {
    return "Operations";
  }

  return "Document";
}


/* ---------------------------------------------------------
   EMAIL
   --------------------------------------------------------- */

function extractEmail(text) {

  const match = text.match(
    /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i
  );

  return match ? match[0] : "";

}


/* ---------------------------------------------------------
   PHONE
   --------------------------------------------------------- */

function extractPhone(text) {

  const matches = text.match(
    /(?:\+?\d[\d\s().-]{7,}\d)/g
  );

  if (!matches) return "";

  for (const value of matches) {

    const digits = value.replace(/\D/g, "");

    if (digits.length >= 9 && digits.length <= 15) {
      return value.trim();
    }

  }

  return "";

}


/* ---------------------------------------------------------
   LOCATION
   --------------------------------------------------------- */

function extractLocation(text) {

  const t = normalizeText(text);

  const locations = [
    "Marrakech",
    "Marrakesh",
    "Casablanca",
    "Rabat",
    "Fes",
    "Fez",
    "Tangier",
    "Agadir",
    "Meknes",
    "Oujda",
    "Paris",
    "London",
    "New York",
    "Bellevue"
  ];

  for (const location of locations) {

    if (t.includes(normalizeText(location))) {
      return location;
    }

  }

  const patterns = [
    /location\s*[:\-]\s*([^\n]+)/i,
    /address\s*[:\-]\s*([^\n]+)/i,
    /adresse\s*[:\-]\s*([^\n]+)/i
  ];

  for (const pattern of patterns) {

    const match = text.match(pattern);

    if (match) {
      return match[1].trim();
    }

  }

  return "";

}


/* ---------------------------------------------------------
   LANGUAGES
   --------------------------------------------------------- */

function extractLanguages(text) {

  const t = normalizeText(text);

  const languages = [];

  const knownLanguages = [
    ["English", "english"],
    ["French", "french"],
    ["Arabic", "arabic"],
    ["Spanish", "spanish"],
    ["German", "german"],
    ["Italian", "italian"],
    ["Portuguese", "portuguese"],
    ["Dutch", "dutch"],
    ["Russian", "russian"]
  ];

  for (const [display, search] of knownLanguages) {

    if (t.includes(search)) {
      languages.push(display);
    }

  }

  return languages.join(", ");

}


/* ---------------------------------------------------------
   BIRTH DATE
   --------------------------------------------------------- */

function extractBirthDate(text) {

  const patterns = [

    /date\s+de\s+naissance\s*[:\-]?\s*([^\n]+)/i,

    /birth\s*date\s*[:\-]?\s*([^\n]+)/i,

    /date\s+of\s+birth\s*[:\-]?\s*([^\n]+)/i,

    /(\d{1,2}\s+(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{4})/i,

    /(\d{1,2}\s+(?:janvier|fevrier|février|mars|avril|mai|juin|juillet|aout|août|septembre|octobre|novembre|decembre|décembre)\s+\d{4})/i,

    /(\d{1,2}[\/.-]\d{1,2}[\/.-]\d{4})/

  ];

  for (const pattern of patterns) {

    const match = text.match(pattern);

    if (match) {

      return match[1]
        .trim()
        .replace(/\s+/g, " ");

    }

  }

  return "";

}


/* ---------------------------------------------------------
   PROFESSION
   --------------------------------------------------------- */

function extractProfession(text) {

  const t = normalizeText(text);

  const professions = [
    ["Barman / Mixologist", [
      "barman",
      "mixologist",
      "bartender",
      "bar manager"
    ]],

    ["Manager", [
      "manager",
      "management",
      "supervisor"
    ]],

    ["Accountant", [
      "accountant",
      "accounting",
      "bookkeeper"
    ]],

    ["Marketing", [
      "marketing",
      "public relations"
    ]],

    ["Customer Service", [
      "customer service"
    ]],

    ["Chef", [
      "chef"
    ]],

    ["Engineer", [
      "engineer"
    ]],

    ["Teacher", [
      "teacher"
    ]],

    ["Developer", [
      "developer",
      "software engineer",
      "programmer"
    ]]

  ];

  for (const [profession, keywords] of professions) {

    for (const keyword of keywords) {

      if (t.includes(keyword)) {
        return profession;
      }

    }

  }

  return "";

}


/* ---------------------------------------------------------
   NAME
   --------------------------------------------------------- */

function extractName(text) {

  const lines = text
    .split(/\n+/)
    .map(line => line.trim())
    .filter(Boolean);

  /*
    First look for explicit labels.
  */

  const labelPatterns = [
    /^(?:name|nom)\s*[:\-]\s*(.+)$/i,
    /^(?:full name|nom complet)\s*[:\-]\s*(.+)$/i
  ];

  for (const line of lines) {

    for (const pattern of labelPatterns) {

      const match = line.match(pattern);

      if (match) {
        return match[1].trim();
      }

    }

  }


  /*
    Ignore obvious non-name lines.
  */

  const badWords = [
    "resume",
    "curriculum",
    "curriculum vitae",
    "experience",
    "experiences",
    "professional",
    "education",
    "formation",
    "skills",
    "competences",
    "languages",
    "langues",
    "contact",
    "email",
    "phone",
    "telephone",
    "address",
    "marrakech",
    "morocco",
    "maroc",
    "barman",
    "mixologist",
    "manager",
    "sample",
    "revision"
  ];


  /*
    Prefer a short all-uppercase name.
  */

  for (const line of lines.slice(0, 30)) {

    const cleaned = line
      .replace(/[^A-Za-zÀ-ÿ' -]/g, "")
      .trim();

    if (
      cleaned &&
      cleaned.length >= 3 &&
      cleaned.length <= 45 &&
      cleaned === cleaned.toUpperCase() &&
      /^[A-ZÀ-Ÿ' -]+$/.test(cleaned)
    ) {

      const lower = normalizeText(cleaned);

      if (
        !badWords.some(word =>
          lower.includes(normalizeText(word))
        )
      ) {
        return cleaned;
      }

    }

  }


  /*
    Look for 2-4 word name-like lines.
  */

  for (const line of lines.slice(0, 25)) {

    const cleaned = line
      .replace(/[^A-Za-zÀ-ÿ' -]/g, "")
      .trim();

    const words = cleaned.split(/\s+/);

    if (
      words.length >= 2 &&
      words.length <= 4 &&
      cleaned.length <= 45
    ) {

      const lower = normalizeText(cleaned);

      if (
        !badWords.some(word =>
          lower.includes(normalizeText(word))
        )
      ) {

        const looksLikeName =
          words.every(word =>
            /^[A-ZÀ-Ÿ][A-Za-zÀ-ÿ'’-]*$/.test(word)
          );

        if (looksLikeName) {
          return cleaned;
        }

      }

    }

  }

  return "";

}


/* ---------------------------------------------------------
   SAFE FILENAME
   --------------------------------------------------------- */

function safeFilenamePart(value) {

  return (value || "")
    .trim()
    .replace(/[<>:"/\\|?*\x00-\x1F]/g, "")
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "");

}


/* ---------------------------------------------------------
   MAKE FILENAME
   --------------------------------------------------------- */

function makeFilename(
  type,
  name,
  profession,
  location
) {

  const parts = [];

  const cleanName = safeFilenamePart(name);
  const cleanProfession = safeFilenamePart(profession);
  const cleanLocation = safeFilenamePart(location);

  if (cleanName) {
    parts.push(cleanName);
  }

  if (cleanProfession) {
    parts.push(cleanProfession);
  }

  if (type) {

    const cleanType =
      safeFilenamePart(type);

    if (cleanType) {
      parts.push(cleanType);
    }

  }

  if (cleanLocation) {
    parts.push(cleanLocation);
  }

  if (parts.length === 0) {
    return "SmartDoc-Document.pdf";
  }

  return parts.join("_") + ".pdf";

}


/* ---------------------------------------------------------
   EXTRACT TEXT FROM NORMAL PDF
   --------------------------------------------------------- */

async function extractPdfText(file) {

  if (!window.pdfjsLib) {
    throw new Error("PDF.js failed to load.");
  }

  const arrayBuffer =
    await file.arrayBuffer();

  const pdf =
    await pdfjsLib.getDocument({
      data: arrayBuffer
    }).promise;

  let fullText = "";

  for (
    let pageNumber = 1;
    pageNumber <= pdf.numPages;
    pageNumber++
  ) {

    const page =
      await pdf.getPage(pageNumber);

    const content =
      await page.getTextContent();

    const pageText =
      content.items
        .map(item => item.str || "")
        .join(" ");

    fullText +=
      pageText + "\n";

  }

  return cleanText(fullText);

}


/* ---------------------------------------------------------
   RENDER PDF PAGE
   --------------------------------------------------------- */

async function renderPageToCanvas(
  pdf,
  pageNumber
) {

  const page =
    await pdf.getPage(pageNumber);

  const viewport =
    page.getViewport({
      scale: 2
    });

  const canvas =
    document.createElement("canvas");

  const context =
    canvas.getContext("2d");

  canvas.width =
    viewport.width;

  canvas.height =
    viewport.height;

  await page.render({
    canvasContext: context,
    viewport: viewport
  }).promise;

  return canvas;

}


/* ---------------------------------------------------------
   OCR PDF
   --------------------------------------------------------- */

async function ocrPdf(file) {

  if (!window.Tesseract) {
    throw new Error("OCR library failed to load.");
  }

  if (!window.pdfjsLib) {
    throw new Error("PDF.js failed to load.");
  }

  const arrayBuffer =
    await file.arrayBuffer();

  const pdf =
    await pdfjsLib.getDocument({
      data: arrayBuffer
    }).promise;


  showStatus(
    "Scanned PDF detected. Starting OCR...",
    "info"
  );


  /*
    English + French works well for the CVs
    you have been testing.
  */

  const worker =
    await Tesseract.createWorker(
      "eng+fra",
      1,
      {
        logger: message => {

          if (
            message.status ===
            "recognizing text"
          ) {

            const percent =
              Math.round(
                (message.progress || 0) * 100
              );

            showStatus(
              "OCR in progress: " +
              percent +
              "%",
              "info"
            );

          }

        }
      }
    );


  let fullText = "";


  try {

    for (
      let pageNumber = 1;
      pageNumber <= pdf.numPages;
      pageNumber++
    ) {

      showStatus(
        "OCR: reading page " +
        pageNumber +
        " of " +
        pdf.numPages +
        "...",
        "info"
      );


      const canvas =
        await renderPageToCanvas(
          pdf,
          pageNumber
        );


      const result =
        await worker.recognize(
          canvas
        );


      if (
        result &&
        result.data &&
        result.data.text
      ) {

        fullText +=
          result.data.text +
          "\n\n";

      }

    }

  } finally {

    await worker.terminate();

  }


  return cleanText(fullText);

}


/* ---------------------------------------------------------
   DISPLAY RESULT
   --------------------------------------------------------- */

function displayResult(
  file,
  text,
  usedOCR
) {

  const clean =
    cleanText(text);

  const type =
    detectDocumentType(clean);

  const name =
    extractName(clean);

  const profession =
    extractProfession(clean);

  const location =
    extractLocation(clean);

  const email =
    extractEmail(clean);

  const phone =
    extractPhone(clean);

  const languages =
    extractLanguages(clean);

  const birthDate =
    extractBirthDate(clean);


  resultsBox.innerHTML = "";


  const card =
    document.createElement("div");

  card.className =
    "document";


  const title =
    document.createElement("h2");

  title.className =
    "success-title";

  title.textContent =
    "✓ Document successfully analyzed";

  card.appendChild(title);


  const fileName =
    document.createElement("p");

  fileName.textContent =
    file.name;

  card.appendChild(fileName);


  const method =
    document.createElement("p");

  method.className =
    "method";

  method.textContent =
    "Analysis method: " +
    (usedOCR ? "OCR" : "PDF text");

  card.appendChild(method);


  const line =
    document.createElement("hr");

  card.appendChild(line);


  function createField(
    labelText,
    value,
    id
  ) {

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "field";


    const label =
      document.createElement("label");

    label.textContent =
      labelText;


    const input =
      document.createElement("input");

    input.type =
      "text";

    input.id =
      id;

    input.value =
      value || "";


    wrapper.appendChild(label);
    wrapper.appendChild(input);

    card.appendChild(wrapper);

    return input;

  }


  const typeInput =
    createField(
      "Document type",
      type,
      "editType"
    );


  const nameInput =
    createField(
      "Name",
      name,
      "editName"
    );


  const professionInput =
    createField(
      "Profession",
      profession,
      "editProfession"
    );


  const locationInput =
    createField(
      "Location",
      location,
      "editLocation"
    );


  const emailInput =
    createField(
      "Email",
      email,
      "editEmail"
    );


  const phoneInput =
    createField(
      "Phone",
      phone,
      "editPhone"
    );


  const languagesInput =
    createField(
      "Languages",
      languages,
      "editLanguages"
    );


  const birthDateInput =
    createField(
      "Birth date",
      birthDate,
      "editBirthDate"
    );


  /*
    Suggested filename
  */

  const filenameBox =
    document.createElement("div");

  filenameBox.className =
    "filename-box";


  const filenameTitle =
    document.createElement("strong");

  filenameTitle.textContent =
    "Suggested filename:";


  const filename =
    document.createElement("div");

  filename.className =
    "filename";


  filenameBox.appendChild(
    filenameTitle
  );

  filenameBox.appendChild(
    filename
  );

  card.appendChild(
    filenameBox
  );


  /*
    Copy button
  */

  const copyButton =
    document.createElement("button");

  copyButton.className =
    "copy-button";

  copyButton.textContent =
    "Copy filename";

  card.appendChild(
    copyButton
  );


  /*
    Raw text
  */

  const details =
    document.createElement("details");


  const summary =
    document.createElement("summary");

  summary.textContent =
    usedOCR
      ? "Show raw OCR text"
      : "Show raw PDF text";


  const rawText =
    document.createElement("pre");

  rawText.textContent =
    clean || "(No text detected.)";


  details.appendChild(
    summary
  );

  details.appendChild(
    rawText
  );

  card.appendChild(
    details
  );


  resultsBox.appendChild(
    card
  );


  /*
    Filename updates whenever
    an editable field changes.
  */

  function updateFilename() {

    filename.textContent =
      makeFilename(
        typeInput.value,
        nameInput.value,
        professionInput.value,
        locationInput.value
      );

  }


  typeInput.addEventListener(
    "input",
    updateFilename
  );

  nameInput.addEventListener(
    "input",
    updateFilename
  );

  professionInput.addEventListener(
    "input",
    updateFilename
  );

  locationInput.addEventListener(
    "input",
    updateFilename
  );


  /*
    Copy filename
  */

  copyButton.addEventListener(
    "click",
    async function() {

      try {

        await navigator.clipboard.writeText(
          filename.textContent
        );

        copyButton.textContent =
          "✓ Copied";

        setTimeout(
          function() {

            copyButton.textContent =
              "Copy filename";

          },
          1500
        );

      } catch (error) {

        /*
          Fallback for browsers
          where clipboard is unavailable.
        */

        const temp =
          document.createElement("textarea");

        temp.value =
          filename.textContent;

        document.body.appendChild(temp);

        temp.select();

        document.execCommand("copy");

        temp.remove();

        copyButton.textContent =
          "✓ Copied";

        setTimeout(
          function() {

            copyButton.textContent =
              "Copy filename";

          },
          1500
        );

      }

    }
  );


  updateFilename();

}


/* ---------------------------------------------------------
   ANALYZE PDF
   --------------------------------------------------------- */

async function analyzePdf(file) {

  resultsBox.innerHTML = "";

  clearStatus();


  if (!file) {
    return;
  }


  if (
    file.type !== "application/pdf" &&
    !file.name.toLowerCase().endsWith(".pdf")
  ) {

    showStatus(
      "Please choose a PDF file.",
      "error"
    );

    return;

  }


  showStatus(
    "Reading PDF...",
    "info"
  );


  try {

    /*
      First attempt:
      read normal PDF text.
    */

    let text =
      await extractPdfText(file);


    /*
      If enough text exists,
      this is a normal PDF.
    */

    if (
      text &&
      text.replace(/\s/g, "").length >= 30
    ) {

      displayResult(
        file,
        text,
        false
      );

      showStatus(
        "Analysis complete.",
        "success"
      );

      return;

    }


    /*
      If there is little/no text,
      it is probably a scanned PDF.
      Use OCR.
    */

    showStatus(
      "No usable PDF text found. Switching to OCR...",
      "info"
    );


    text =
      await ocrPdf(file);


    if (
      !text ||
      text.replace(/\s/g, "").length < 5
    ) {

      throw new Error(
        "OCR could not find readable text in this PDF."
      );

    }


    displayResult(
      file,
      text,
      true
    );


    showStatus(
      "Analysis complete.",
      "success"
    );


  } catch (error) {

    console.error(
      "SmartDoc error:",
      error
    );


    showStatus(
      "Something went wrong while analyzing the PDF. " +
      "Please try again.",
      "error"
    );

  }

}


/* ---------------------------------------------------------
   FILE INPUT
   --------------------------------------------------------- */

fileInput.addEventListener(
  "change",
  function(event) {

    const file =
      event.target.files &&
      event.target.files[0];

    if (file) {
      analyzePdf(file);
    }

  }
);


/* ---------------------------------------------------------
   DRAG & DROP
   --------------------------------------------------------- */

uploadBox.addEventListener(
  "dragover",
  function(event) {

    event.preventDefault();

    uploadBox.classList.add(
      "dragover"
    );

  }
);


uploadBox.addEventListener(
  "dragleave",
  function() {

    uploadBox.classList.remove(
      "dragover"
    );

  }
);


uploadBox.addEventListener(
  "drop",
  function(event) {

    event.preventDefault();

    uploadBox.classList.remove(
      "dragover"
    );


    const file =
      event.dataTransfer.files &&
      event.dataTransfer.files[0];


    if (file) {
      analyzePdf(file);
    }

  }
);


/* ---------------------------------------------------------
   STARTUP CHECK
   --------------------------------------------------------- */

window.addEventListener(
  "load",
  function() {

    if (!window.pdfjsLib) {

      showStatus(
        "PDF reader failed to load. Please refresh the page.",
        "error"
      );

      return;

    }


    if (!window.Tesseract) {

      showStatus(
        "OCR library failed to load. Normal PDFs can still be read.",
        "error"
      );

    }

  }
);

</script>
