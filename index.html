<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SmartDoc Organizer</title>

  <!-- Tesseract OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 40px 20px;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .upload-box {
      background: white;
      border: 2px dashed #999;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      margin-bottom: 25px;
    }

    .upload-box:hover {
      border-color: #333;
    }

    input[type="file"] {
      margin-top: 20px;
    }

    #status {
      background: white;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
    }

    .document {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .filename {
      background: #f0f2f4;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      margin-top: 8px;
    }

    .ocr-text {
      background: #f8f8f8;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      margin-top: 15px;
      max-height: 400px;
      overflow: auto;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SmartDoc Organizer</h1>

  <div class="subtitle">
    Upload a PDF and SmartDoc will read it using PDF extraction or OCR.
  </div>

  <div class="upload-box">

    <strong>Upload your PDF</strong>

    <br><br>

    <input
      type="file"
      id="fileInput"
      accept=".pdf"
    >

  </div>

  <div id="status"></div>

  <div id="results"></div>

</div>

<script type="module">

  import * as pdfjsLib from
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs";


  const fileInput = document.getElementById("fileInput");

  const statusBox = document.getElementById("status");

  const resultsBox = document.getElementById("results");


  function showStatus(message) {

    statusBox.style.display = "block";

    statusBox.innerHTML = message;

  }


  function clearResults() {

    resultsBox.innerHTML = "";

  }


  async function loadPDF(file) {

    const buffer = await file.arrayBuffer();

    const pdf = await pdfjsLib
      .getDocument({ data: buffer })
      .promise;

    return pdf;

  }


  async function extractNormalText(pdf) {

    let text = "";

    const pages = Math.min(pdf.numPages, 10);

    for (let pageNumber = 1; pageNumber <= pages; pageNumber++) {

      showStatus(
        "Reading PDF text... page " +
        pageNumber +
        " of " +
        pages
      );

      const page = await pdf.getPage(pageNumber);

      const content = await page.getTextContent();

      const pageText = content.items
        .map(item => item.str)
        .join(" ");

      text += "\n" + pageText;

    }

    return text.trim();

  }


  async function renderPage(pdf, pageNumber) {

    const page = await pdf.getPage(pageNumber);

    const scale = 2.5;

    const viewport = page.getViewport({
      scale: scale
    });

    const canvas = document.createElement("canvas");

    const context = canvas.getContext("2d");

    canvas.width = viewport.width;

    canvas.height = viewport.height;

    await page.render({

      canvasContext: context,

      viewport: viewport

    }).promise;

    return canvas;

  }


  async function performOCR(pdf) {

    showStatus(
      "Scanned PDF detected.<br>" +
      "Starting OCR engine..."
    );


    const worker = await Tesseract.createWorker(

      "eng",

      1,

      {

        logger: function(message) {

          if (message.status) {

            const percentage =
              message.progress
                ? Math.round(message.progress * 100)
                : 0;

            showStatus(
              message.status +
              "<br>" +
              percentage +
              "%"
            );

          }

        }

      }

    );


    let allText = "";

    const pages = Math.min(pdf.numPages, 3);


    for (
      let pageNumber = 1;
      pageNumber <= pages;
      pageNumber++
    ) {

      showStatus(
        "OCR reading page " +
        pageNumber +
        " of " +
        pages +
        "..."
      );


      const canvas =
        await renderPage(
          pdf,
          pageNumber
        );


      const result =
        await worker.recognize(canvas);


      const pageText =
        result.data.text || "";


      allText +=
        "\n\n--- Page " +
        pageNumber +
        " ---\n\n" +
        pageText;

    }


    await worker.terminate();


    return allText.trim();

  }


  function showResult(file, text, usedOCR) {

    resultsBox.innerHTML = "";


    const card =
      document.createElement("div");


    card.className = "document";


    card.innerHTML = `

      <h2>${file.name}</h2>

      <p>
        <strong>Method:</strong>
        ${usedOCR ? "OCR" : "PDF text extraction"}
      </p>

      <p>
        <strong>Characters found:</strong>
        ${text.length}
      </p>

      <h3>Raw text detected</h3>

      <div class="ocr-text">
        ${escapeHTML(text || "NO TEXT DETECTED")}
      </div>

    `;


    resultsBox.appendChild(card);

  }


  function escapeHTML(text) {

    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  fileInput.addEventListener(
    "change",
    async function() {

      const file =
        fileInput.files[0];


      if (!file) {

        return;

      }


      clearResults();


      try {

        showStatus(
          "Loading <strong>" +
          file.name +
          "</strong>..."
        );


        const pdf =
          await loadPDF(file);


        showStatus(
          "PDF loaded.<br>" +
          "Pages: " +
          pdf.numPages
        );


        const normalText =
          await extractNormalText(pdf);


        let finalText =
          normalText;


        let usedOCR =
          false;


        if (
          !normalText ||
          normalText.replace(/\s/g, "").length < 30
        ) {

          usedOCR = true;

          finalText =
            await performOCR(pdf);

        }


        showResult(
          file,
          finalText,
          usedOCR
        );


        showStatus(
          "Finished analyzing the document."
        );


      } catch (error) {

        console.error(error);


        showStatus(
          "<strong>Error:</strong><br>" +
          escapeHTML(error.message)
        );

      }

    }
  );

</script>

</body>
</html>
