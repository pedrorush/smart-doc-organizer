<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDoc Organizer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 30px;
    }

    .upload-box {
      background: white;
      border: 2px dashed #9ca3af;
      border-radius: 16px;
      padding: 45px 20px;
      text-align: center;
      transition: 0.2s;
    }

    .upload-box.dragover {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .upload-box h2 {
      margin-bottom: 10px;
    }

    .upload-box p {
      color: #6b7280;
    }

    #fileInput {
      display: none;
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 22px;
      background: #2563eb;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin: 25px 0;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .stat-number {
      font-size: 28px;
      font-weight: bold;
    }

    .stat-label {
      color: #6b7280;
      margin-top: 5px;
    }

    .results {
      display: grid;
      gap: 20px;
    }

    .category {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .category h2 {
      margin-top: 0;
    }

    .file {
      border-top: 1px solid #e5e7eb;
      padding: 18px 0;
    }

    .original {
      font-weight: bold;
      word-break: break-word;
      margin-bottom: 10px;
    }

    .field {
      margin: 5px 0;
      font-size: 14px;
    }

    .field strong {
      color: #374151;
    }

    .suggestion {
      margin-top: 12px;
      padding: 10px;
      background: #eff6ff;
      border-radius: 8px;
      color: #1d4ed8;
      font-weight: bold;
      word-break: break-word;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      color: #6b7280;
      display: none;
    }

    .empty {
      color: #9ca3af;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SmartDoc Organizer</h1>

  <p class="subtitle">
    Upload documents and automatically understand and organize them.
  </p>

  <div class="upload-box" id="uploadBox">

    <h2>Drop your documents here</h2>

    <p>SmartDoc will inspect the text inside your PDF.</p>

    <label class="button" for="fileInput">
      Choose Files
    </label>

    <input
      type="file"
      id="fileInput"
      multiple
      accept=".pdf,.txt"
    >

  </div>

  <div class="status" id="status"></div>

  <div class="stats">

    <div class="stat">
      <div class="stat-number" id="totalFiles">0</div>
      <div class="stat-label">Files</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="financeCount">0</div>
      <div class="stat-label">Finance</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="hrCount">0</div>
      <div class="stat-label">HR</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="legalCount">0</div>
      <div class="stat-label">Legal</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="otherCount">0</div>
      <div class="stat-label">Other</div>
    </div>

  </div>

  <div id="results" class="results">

    <div class="empty">
      No documents uploaded yet.
    </div>

  </div>

</div>


<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.105/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.105/pdf.worker.min.mjs";


const uploadBox = document.getElementById("uploadBox");
const fileInput = document.getElementById("fileInput");
const results = document.getElementById("results");
const status = document.getElementById("status");

const totalFiles = document.getElementById("totalFiles");
const financeCount = document.getElementById("financeCount");
const hrCount = document.getElementById("hrCount");
const legalCount = document.getElementById("legalCount");
const otherCount = document.getElementById("otherCount");


const categories = [
  "Finance",
  "Human Resources",
  "Legal",
  "Marketing",
  "Operations",
  "Other"
];


fileInput.addEventListener("change", () => {
  analyzeFiles(fileInput.files);
});


uploadBox.addEventListener("dragover", event => {

  event.preventDefault();

  uploadBox.classList.add("dragover");

});


uploadBox.addEventListener("dragleave", () => {

  uploadBox.classList.remove("dragover");

});


uploadBox.addEventListener("drop", event => {

  event.preventDefault();

  uploadBox.classList.remove("dragover");

  analyzeFiles(event.dataTransfer.files);

});


async function analyzeFiles(files) {

  results.innerHTML = "";

  showStatus("Reading your documents...");

  const grouped = {};

  categories.forEach(category => {
    grouped[category] = [];
  });


  let count = 0;


  for (const file of Array.from(files)) {

    count++;

    showStatus(
      `Analyzing document ${count} of ${files.length}: ${file.name}`
    );


    let text = "";


    try {

      if (file.type === "application/pdf") {

        text = await extractPdfText(file);

      } else if (file.type === "text/plain") {

        text = await file.text();

      }

    } catch (error) {

      console.error(error);

    }


    const information =
      extractInformation(file.name, text);


    grouped[information.category].push({

      original: file.name,

      information: information

    });

  }


  displayResults(grouped);

  showStatus(
    `Finished analyzing ${files.length} document(s).`
  );

}


async function extractPdfText(file) {

  const arrayBuffer = await file.arrayBuffer();

  const pdf = await pdfjsLib.getDocument({
    data: arrayBuffer
  }).promise;


  let fullText = "";

  const maxPages = Math.min(pdf.numPages, 10);


  for (
    let pageNumber = 1;
    pageNumber <= maxPages;
    pageNumber++
  ) {

    const page = await pdf.getPage(pageNumber);

    const content =
      await page.getTextContent();


    const pageText = content.items
      .map(item => item.str)
      .join(" ");


    fullText += pageText + "\n";

  }


  return fullText;

}


function extractInformation(filename, text) {

  const combined =
    (filename + "\n" + text);


  const lower =
    combined.toLowerCase();


  let category = "Other";


  if (
    lower.includes("invoice") ||
    lower.includes("receipt") ||
    lower.includes("amount due") ||
    lower.includes("subtotal") ||
    lower.includes("total due")
  ) {

    category = "Finance";

  } else if (
    lower.includes("resume") ||
    lower.includes("curriculum vitae") ||
    lower.includes("employee") ||
    lower.includes("job application") ||
    lower.includes("payroll")
  ) {

    category = "Human Resources";

  } else if (
    lower.includes("contract") ||
    lower.includes("agreement") ||
    lower.includes("non-disclosure") ||
    lower.includes("nda") ||
    lower.includes("terms and conditions")
  ) {

    category = "Legal";

  } else if (
    lower.includes("marketing") ||
    lower.includes("campaign") ||
    lower.includes("advertising")
  ) {

    category = "Marketing";

  } else if (
    lower.includes("project") ||
    lower.includes("meeting") ||
    lower.includes("operations") ||
    lower.includes("internal report")
  ) {

    category = "Operations";

  }


  const invoiceNumber =
    findInvoiceNumber(combined);


  const date =
    findDate(combined);


  const amount =
    findAmount(combined);


  const company =
    findCompany(combined);


  const documentType =
    findDocumentType(lower, category);


  const suggestedName =
    buildFilename(
      documentType,
      company,
      date,
      invoiceNumber,
      filename
    );


  return {

    category,

    documentType,

    company,

    invoiceNumber,

    date,

    amount,

    suggestedName,

    textFound: text.length > 0

  };

}


function findDocumentType(text, category) {

  const lower = text.toLowerCase();


  if (lower.includes("invoice")) {
    return "Invoice";
  }

  if (lower.includes("receipt")) {
    return "Receipt";
  }

  if (lower.includes("contract")) {
    return "Contract";
  }

  if (lower.includes("agreement")) {
    return "Agreement";
  }

  if (
    lower.includes("resume") ||
    lower.includes("curriculum vitae")
  ) {
    return "Resume";
  }

  if (lower.includes("report")) {
    return "Report";
  }

  if (lower.includes("meeting")) {
    return "Meeting";
  }


  return category === "Other"
    ? "Document"
    : category + " Document";

}


function findInvoiceNumber(text) {

  const patterns = [

    /invoice\s*(?:number|no|#)?\s*[:\-]?\s*([A-Z0-9\-\/]+)/i,

    /inv\s*(?:number|no|#)?\s*[:\-]?\s*([A-Z0-9\-\/]+)/i

  ];


  for (const pattern of patterns) {

    const match = text.match(pattern);

    if (match) {
      return match[1];
    }

  }


  return "";

}


function findDate(text) {

  const patterns = [

    /\b(20\d{2}[-\/]\d{1,2}[-\/]\d{1,2})\b/,

    /\b(\d{1,2}[-\/]\d{1,2}[-\/]20\d{2})\b/,

    /\b(January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{1,2},?\s+20\d{2}\b/i

  ];


  for (const pattern of patterns) {

    const match = text.match(pattern);

    if (match) {
      return match[1] || match[0];
    }

  }


  return "";

}


function findAmount(text) {

  const patterns = [

    /(?:total due|amount due|grand total|total)\s*[:\-]?\s*([$€£]\s?[\d,]+(?:\.\d{2})?)/i,

    /([$€£]\s?[\d,]+(?:\.\d{2})?)/

  ];


  for (const pattern of patterns) {

    const match = text.match(pattern);

    if (match) {
      return match[1];
    }

  }


  return "";

}


function findCompany(text) {

  const lines =
    text.split(/\n+/)
      .map(line => line.trim())
      .filter(line => line.length > 2);


  const keywords = [
    "invoice from",
    "billed by",
    "from:",
    "vendor:",
    "supplier:",
    "company:"
  ];


  for (const line of lines) {

    const lower = line.toLowerCase();


    for (const keyword of keywords) {

      if (lower.startsWith(keyword)) {

        const value =
          line.substring(keyword.length)
            .replace(/^[:\-\s]+/, "")
            .trim();


        if (value.length > 1) {
          return value;
        }

      }

    }

  }


  return "";

}


function buildFilename(
  documentType,
  company,
  date,
  invoiceNumber,
  originalFilename
) {

  const parts = [];

  parts.push(cleanPart(documentType));


  if (company) {
    parts.push(cleanPart(company));
  }


  if (date) {
    parts.push(cleanPart(date));
  }


  if (invoiceNumber) {
    parts.push("No-" + cleanPart(invoiceNumber));
  }


  let extension = ".pdf";


  if (originalFilename.includes(".")) {

    extension =
      originalFilename
        .substring(originalFilename.lastIndexOf("."))
        .toLowerCase();

  }


  return parts.join("_") + extension;

}


function cleanPart(value) {

  return value
    .replace(/[^\w\s\-\/]/g, "")
    .replace(/\s+/g, "-")
    .replace(/[\/]+/g, "-")
    .substring(0, 50);

}


function displayResults(grouped) {

  results.innerHTML = "";

  let total = 0;


  categories.forEach(category => {

    const files = grouped[category];

    total += files.length;


    if (files.length === 0) {
      return;
    }


    const categoryBox =
      document.createElement("div");


    categoryBox.className = "category";


    categoryBox.innerHTML =
      `<h2>${category} (${files.length})</h2>`;


    files.forEach(file => {

      const info =
        file.information;


      const fileBox =
        document.createElement("div");


      fileBox.className = "file";


      fileBox.innerHTML = `

        <div class="original">
          ${escapeHtml(file.original)}
        </div>

        <div class="field">
          <strong>Type:</strong>
          ${escapeHtml(info.documentType)}
        </div>

        <div class="field">
          <strong>Company:</strong>
          ${escapeHtml(info.company || "Not detected")}
        </div>

        <div class="field">
          <strong>Invoice #:</strong>
          ${escapeHtml(info.invoiceNumber || "Not detected")}
        </div>

        <div class="field">
          <strong>Date:</strong>
          ${escapeHtml(info.date || "Not detected")}
        </div>

        <div class="field">
          <strong>Amount:</strong>
          ${escapeHtml(info.amount || "Not detected")}
        </div>

        <div class="suggestion">
          Suggested filename:<br>
          ${escapeHtml(info.suggestedName)}
        </div>

      `;


      categoryBox.appendChild(fileBox);

    });


    results.appendChild(categoryBox);

  });


  totalFiles.textContent = total;

  financeCount.textContent =
    grouped["Finance"].length;

  hrCount.textContent =
    grouped["Human Resources"].length;

  legalCount.textContent =
    grouped["Legal"].length;

  otherCount.textContent =
    grouped["Other"].length +
    grouped["Marketing"].length +
    grouped["Operations"].length;

}


function showStatus(message) {

  status.style.display = "block";

  status.textContent = message;

}


function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
</html>
