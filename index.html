<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SmartDoc Organizer</title>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>

  <!-- Tesseract OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 30px;
    }

    .upload-box {
      display: block;
      border: 2px dashed #9ca3af;
      border-radius: 14px;
      padding: 45px 20px;
      text-align: center;
      background: white;
      cursor: pointer;
    }

    .upload-box:hover,
    .upload-box.dragover {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .upload-box strong {
      display: block;
      font-size: 20px;
      margin-bottom: 10px;
    }

    #fileInput {
      display: none;
    }

    .status {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: white;
    }

    .result {
      display: none;
      margin-top: 25px;
      background: white;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .success {
      padding: 12px;
      background: #ecfdf5;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: bold;
      color: #6b7280;
    }

    .field input {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 15px;
    }

    .filename {
      margin-top: 8px;
      padding: 12px;
      background: #f3f4f6;
      border-radius: 8px;
      font-family: monospace;
      word-break: break-all;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 12px;
      margin-right: 8px;
    }

    .download-btn {
      background: #2563eb;
      color: white;
    }

    .copy-btn {
      background: #111827;
      color: white;
    }

    .raw-btn {
      background: #e5e7eb;
      color: #111827;
    }

    .raw-text {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: #111827;
      color: white;
      border-radius: 8px;
      white-space: pre-wrap;
      max-height: 400px;
      overflow: auto;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SmartDoc Organizer</h1>

  <div class="subtitle">
    Upload a document and SmartDoc will read, understand and organize it.
  </div>

  <label class="upload-box" id="uploadBox">

    <strong>Drop a PDF here</strong>

    <span>or click to choose a PDF</span>

    <br><br>

    <small>
      SmartDoc can read normal PDFs and scanned PDFs using OCR.
    </small>

    <input
      type="file"
      id="fileInput"
      accept=".pdf,application/pdf"
    >

  </label>

  <div id="status" class="status"></div>

  <div id="result" class="result"></div>

</div>


<script>

let currentFile = null;
let currentSuggestedFilename = "";
let currentRawText = "";
let pdfjsReady = false;


/* --------------------------------
   LOAD PDF.JS
-------------------------------- */

async function loadPdfJs() {

  if (window.pdfjsLib) {
    pdfjsReady = true;
    return;
  }

  try {

    const module =
      await import(
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
      );

    window.pdfjsLib = module;

    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    pdfjsReady = true;

  } catch (error) {

    console.error("PDF.js failed to load:", error);

    throw new Error(
      "PDF reader could not load."
    );
  }
}


/* --------------------------------
   STATUS
-------------------------------- */

function setStatus(message) {

  const status =
    document.getElementById("status");

  status.textContent = message;
  status.style.display = "block";
}


/* --------------------------------
   CLEAN TEXT
-------------------------------- */

function cleanText(text) {

  return (text || "")
    .replace(/\r/g, " ")
    .replace(/\n+/g, "\n")
    .replace(/[ \t]+/g, " ")
    .trim();
}


/* --------------------------------
   DOCUMENT TYPE
-------------------------------- */

function detectDocumentType(text) {

  const lower =
    text
      .toLowerCase()
      .replace(/\s+/g, " ")
      .trim();

  if (
    /\binvoice\b/i.test(lower) ||
    /\bfacture\b/i.test(lower) ||
    /\btotal\s+(due|amount|ttc)\b/i.test(lower)
  ) {
    return "Invoice";
  }

  if (
    /\breceipt\b/i.test(lower) ||
    /\breçu\b/i.test(lower) ||
    /\bticket\s+de\s+caisse\b/i.test(lower)
  ) {
    return "Receipt";
  }

  const resumeSignals = [
    /\bresume\b/i,
    /\bcurriculum vitae\b/i,
    /\bresume samples\b/i,
    /\bwork history\b/i,
    /\bprofessional accomplishments\b/i,
    /\bprofessional experience\b/i,
    /\bprofessional experiences\b/i,
    /\bexperiences professionnelles\b/i,
    /\beducation\b/i,
    /\bsummary of qualifications\b/i,
    /\bcompétences\b/i,
    /\blangues\b/i,
    /\bobjective\b/i
  ];

  let resumeScore = 0;

  for (const signal of resumeSignals) {

    if (signal.test(lower)) {
      resumeScore++;
    }
  }

  if (resumeScore >= 2) {
    return "Resume / CV";
  }


  const contractSignals = [
    /\bcontract\b/i,
    /\bagreement\b/i,
    /\bcontrat\b/i,
    /\bterms and conditions\b/i,
    /\bsignature\b.*\bdate\b/i
  ];

  let contractScore = 0;

  for (const signal of contractSignals) {

    if (signal.test(lower)) {
      contractScore++;
    }
  }

  if (contractScore >= 2) {
    return "Contract";
  }


  if (
    /\bmarketing campaign\b/i.test(lower) ||
    /\bmarketing plan\b/i.test(lower) ||
    /\bcampagne marketing\b/i.test(lower)
  ) {
    return "Marketing";
  }


  if (
    /\boperations report\b/i.test(lower) ||
    /\boperations manual\b/i.test(lower) ||
    /\bprocédure opérationnelle\b/i.test(lower)
  ) {
    return "Operations";
  }

  return "Document";
}


/* --------------------------------
   EMAIL
-------------------------------- */

function extractEmail(text) {

  const match =
    text.match(
      /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i
    );

  return match ? match[0] : "";
}


/* --------------------------------
   PHONE
-------------------------------- */

function extractPhone(text) {

  const matches =
    text.match(
      /(?:\+?\d[\d\s().-]{7,}\d)/g
    );

  if (!matches) {
    return "";
  }

  return matches[0].trim();
}


/* --------------------------------
   BIRTH DATE
-------------------------------- */

function extractBirthDate(text) {

  const patterns = [

    /\b\d{1,2}\s+(jan(?:uary|vier)?|feb(?:ruary|ruary)?|mars|march|avr(?:il)?|april|mai|may|juin|june|juil(?:let)?|july|août|august|sept(?:embre|ember)?|oct(?:obre|ober)?|nov(?:embre|ember)?|déc(?:embre)?|december)\.?\s+\d{4}\b/i,

    /\b\d{1,2}[\/.-]\d{1,2}[\/.-]\d{4}\b/,

    /\b\d{4}[\/.-]\d{1,2}[\/.-]\d{1,2}\b/
  ];

  for (const pattern of patterns) {

    const match =
      text.match(pattern);

    if (match) {
      return match[0];
    }
  }

  return "";
}


/* --------------------------------
   LOCATION
-------------------------------- */

function extractLocation(text) {

  const locations = [
    "Marrakech",
    "Casablanca",
    "Rabat",
    "Agadir",
    "Tangier",
    "Tanger",
    "Fez",
    "Fes",
    "Meknes",
    "Oujda",
    "Bellevue",
    "Omaha",
    "New York",
    "Chicago",
    "Boston",
    "Los Angeles"
  ];

  for (const location of locations) {

    const regex =
      new RegExp(
        "\\b" + location + "\\b",
        "i"
      );

    if (regex.test(text)) {
      return location;
    }
  }

  return "";
}


/* --------------------------------
   LANGUAGES
-------------------------------- */

function extractLanguages(text) {

  const found = [];

  const languages = [
    ["French", /\bfrench\b|\bfrançais\b/i],
    ["English", /\benglish\b|\banglais\b/i],
    ["Arabic", /\barabic\b|\barabe\b/i],
    ["Spanish", /\bspanish\b|\bespañol\b/i],
    ["German", /\bgerman\b|\ballemand\b/i],
    ["Italian", /\bitalian\b|\bitalien\b/i]
  ];

  for (const item of languages) {

    if (item[1].test(text)) {
      found.push(item[0]);
    }
  }

  return found.join(", ");
}


/* --------------------------------
   PROFESSION
-------------------------------- */

function extractProfession(text) {

  const professions = [

    ["Barman / Mixologist", /barman|mixologist|bartender/i],

    ["Manager", /\bmanager\b|management/i],

    ["Accountant", /accountant|accounting/i],

    ["Marketing", /marketing|public relations/i],

    ["Developer", /software developer|web developer|\bdeveloper\b/i],

    ["Designer", /graphic designer|\bdesigner\b/i],

    ["Engineer", /\bengineer\b|engineering/i],

    ["Teacher", /\bteacher\b|teaching/i],

    ["Chef", /\bchef\b|cook/i],

    ["Sales", /sales representative|sales manager|\bsales\b/i]
  ];

  for (const item of professions) {

    if (item[1].test(text)) {
      return item[0];
    }
  }

  return "";
}


/* --------------------------------
   NAME
-------------------------------- */

function extractName(text) {

  const lines =
    text
      .split("\n")
      .map(line => line.trim())
      .filter(Boolean);

  const email =
    extractEmail(text);

  for (
    let i = 0;
    i < Math.min(lines.length, 40);
    i++
  ) {

    const line = lines[i];

    if (
      email &&
      line.includes(email)
    ) {
      continue;
    }

    if (
      /resume samples/i.test(line) ||
      /curriculum vitae/i.test(line) ||
      /professional experience/i.test(line) ||
      /experiences professionnelles/i.test(line) ||
      /education/i.test(line) ||
      /languages/i.test(line) ||
      /compétences/i.test(line) ||
      /summary of qualifications/i.test(line)
    ) {
      continue;
    }

    if (/^KHALID$/i.test(line)) {
      return line;
    }

    if (
      /^[A-ZÀ-Ÿ][A-ZÀ-Ÿa-zà-ÿ'’-]{2,20}(?:\s+[A-ZÀ-Ÿ][A-ZÀ-Ÿa-zà-ÿ'’-]{2,20}){1,3}$/
        .test(line)
    ) {

      if (
        line.length < 50 &&
        !/\d/.test(line)
      ) {
        return line;
      }
    }
  }

  return "";
}


/* --------------------------------
   SAFE FILENAME
-------------------------------- */

function safeFilenamePart(value) {

  return (value || "")
    .replace(/[<>:"/\\|?*]/g, "")
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "");
}


/* --------------------------------
   MAKE FILENAME
-------------------------------- */

function makeFilename(info, originalName) {

  const parts = [];

  if (info.name) {
    parts.push(
      safeFilenamePart(info.name)
    );
  }

  if (info.profession) {
    parts.push(
      safeFilenamePart(info.profession)
    );
  }

  if (info.documentType) {
    parts.push(
      safeFilenamePart(
        info.documentType.replace(/\//g, "-")
      )
    );
  }

  if (info.location) {
    parts.push(
      safeFilenamePart(info.location)
    );
  }

  if (parts.length === 0) {

    return (
      safeFilenamePart(
        originalName.replace(/\.pdf$/i, "")
      ) + ".pdf"
    );
  }

  return parts.join("_") + ".pdf";
}


/* --------------------------------
   EXTRACT PDF TEXT
-------------------------------- */

async function extractPdfText(file) {

  await loadPdfJs();

  const buffer =
    await file.arrayBuffer();

  const pdf =
    await window.pdfjsLib
      .getDocument({
        data: buffer
      })
      .promise;

  let text = "";

  const maxPages =
    Math.min(pdf.numPages, 10);

  for (
    let pageNumber = 1;
    pageNumber <= maxPages;
    pageNumber++
  ) {

    setStatus(
      "Reading PDF page " +
      pageNumber +
      " of " +
      maxPages +
      "..."
    );

    const page =
      await pdf.getPage(pageNumber);

    const content =
      await page.getTextContent();

    const pageText =
      content.items
        .map(item => item.str)
        .join(" ");

    text += "\n" + pageText;
  }

  return {
    text: cleanText(text),
    pdf: pdf
  };
}


/* --------------------------------
   OCR
-------------------------------- */

async function runOCR(file, pdf) {

  let text = "";

  const maxPages =
    Math.min(pdf.numPages, 3);

  for (
    let pageNumber = 1;
    pageNumber <= maxPages;
    pageNumber++
  ) {

    setStatus(
      "Preparing OCR page " +
      pageNumber +
      " of " +
      maxPages +
      "..."
    );

    const page =
      await pdf.getPage(pageNumber);

    const viewport =
      page.getViewport({
        scale: 2.5
      });

    const canvas =
      document.createElement("canvas");

    const context =
      canvas.getContext("2d");

    canvas.width =
      viewport.width;

    canvas.height =
      viewport.height;

    await page.render({
      canvasContext: context,
      viewport: viewport
    }).promise;


    const result =
      await Tesseract.recognize(
        canvas,
        "eng",
        {
          logger: message => {

            if (
              message.status ===
              "recognizing text"
            ) {

              const percent =
                Math.round(
                  (message.progress || 0) * 100
                );

              setStatus(
                "OCR in progress — page " +
                pageNumber +
                ": " +
                percent +
                "%"
              );
            }
          }
        }
      );

    text +=
      "\n" +
      result.data.text;
  }

  return cleanText(text);
}


/* --------------------------------
   ANALYZE
-------------------------------- */

async function analyzeFile(file) {

  currentFile = file;

  setStatus(
    "Starting analysis..."
  );

  const pdfResult =
    await extractPdfText(file);

  let text =
    pdfResult.text;

  let usedOCR = false;

  if (
    text.replace(/\s/g, "").length < 30
  ) {

    usedOCR = true;

    setStatus(
      "Scanned PDF detected. Starting OCR..."
    );

    text =
      await runOCR(
        file,
        pdfResult.pdf
      );
  }

  currentRawText =
    text;

  displayResult(
    file,
    text,
    usedOCR
  );
}


/* --------------------------------
   DISPLAY RESULT
-------------------------------- */

function displayResult(
  file,
  text,
  usedOCR
) {

  const clean =
    cleanText(text);

  const info = {

    documentType:
      detectDocumentType(clean),

    name:
      extractName(clean),

    profession:
      extractProfession(clean),

    location:
      extractLocation(clean),

    email:
      extractEmail(clean),

    phone:
      extractPhone(clean),

    languages:
      extractLanguages(clean),

    birthDate:
      extractBirthDate(clean)
  };

  currentSuggestedFilename =
    makeFilename(
      info,
      file.name
    );


  const result =
    document.getElementById(
      "result"
    );

  result.innerHTML = "";


  const success =
    document.createElement("div");

  success.className =
    "success";

  success.textContent =
    "✓ Document successfully analyzed";

  result.appendChild(
    success
  );


  const fileName =
    document.createElement("p");

  fileName.innerHTML =
    "<strong>" +
    escapeHtml(file.name) +
    "</strong>";

  result.appendChild(
    fileName
  );


  const method =
    document.createElement("p");

  method.innerHTML =
    "<strong>Analysis method:</strong> " +
    (usedOCR ? "OCR" : "PDF text");

  result.appendChild(
    method
  );


  addField(
    result,
    "Document type",
    info.documentType
  );

  addField(
    result,
    "Name",
    info.name
  );

  addField(
    result,
    "Profession",
    info.profession
  );

  addField(
    result,
    "Location",
    info.location
  );

  addField(
    result,
    "Email",
    info.email
  );

  addField(
    result,
    "Phone",
    info.phone
  );

  addField(
    result,
    "Languages",
    info.languages
  );

  addField(
    result,
    "Birth date",
    info.birthDate
  );


  const title =
    document.createElement("p");

  title.style.marginTop =
    "25px";

  title.innerHTML =
    "<strong>Suggested filename:</strong>";

  result.appendChild(
    title
  );


  const filename =
    document.createElement("div");

  filename.className =
    "filename";

  filename.id =
    "filenameBox";

  filename.textContent =
    currentSuggestedFilename;

  result.appendChild(
    filename
  );


  const download =
    document.createElement("button");

  download.className =
    "download-btn";

  download.textContent =
    "Download organized PDF";

  download.onclick =
    downloadOrganizedFile;

  result.appendChild(
    download
  );


  const copy =
    document.createElement("button");

  copy.className =
    "copy-btn";

  copy.textContent =
    "Copy filename";

  copy.onclick =
    copyFilename;

  result.appendChild(
    copy
  );


  const rawButton =
    document.createElement("button");

  rawButton.className =
    "raw-btn";

  rawButton.textContent =
    "Show raw OCR / PDF text";

  rawButton.onclick =
    function () {

      const raw =
        document.getElementById(
          "rawText"
        );

      raw.style.display =
        raw.style.display === "block"
          ? "none"
          : "block";
    };

  result.appendChild(
    rawButton
  );


  const raw =
    document.createElement("div");

  raw.className =
    "raw-text";

  raw.id =
    "rawText";

  raw.textContent =
    clean;

  result.appendChild(
    raw
  );


  result.style.display =
    "block";

  setStatus(
    "Analysis complete."
  );
}


/* --------------------------------
   EDITABLE FIELD
-------------------------------- */

function addField(
  container,
  label,
  value
) {

  const field =
    document.createElement("div");

  field.className =
    "field";


  const labelElement =
    document.createElement("label");

  labelElement.textContent =
    label;


  const input =
    document.createElement("input");

  input.value =
    value || "";

  input.dataset.field =
    label;

  input.addEventListener(
    "input",
    updateFilename
  );


  field.appendChild(
    labelElement
  );

  field.appendChild(
    input
  );

  container.appendChild(
    field
  );
}


/* --------------------------------
   UPDATE FILENAME
-------------------------------- */

function updateFilename() {

  const inputs =
    document.querySelectorAll(
      "#result input"
    );

  const values = {};

  inputs.forEach(
    input => {

      values[input.dataset.field] =
        input.value.trim();
    }
  );


  const info = {

    name:
      values["Name"] || "",

    profession:
      values["Profession"] || "",

    documentType:
      values["Document type"] ||
      "Document",

    location:
      values["Location"] || ""
  };


  currentSuggestedFilename =
    makeFilename(
      info,
      currentFile
        ? currentFile.name
        : "document.pdf"
    );


  const filenameBox =
    document.getElementById(
      "filenameBox"
    );

  if (filenameBox) {

    filenameBox.textContent =
      currentSuggestedFilename;
  }
}


/* --------------------------------
   DOWNLOAD
-------------------------------- */

function downloadOrganizedFile() {

  if (!currentFile) {
    return;
  }

  updateFilename();


  const url =
    URL.createObjectURL(
      currentFile
    );


  const link =
    document.createElement("a");

  link.href =
    url;

  link.download =
    currentSuggestedFilename;


  document.body.appendChild(
    link
  );

  link.click();

  link.remove();


  setTimeout(
    function () {
      URL.revokeObjectURL(url);
    },
    1000
  );
}


/* --------------------------------
   COPY
-------------------------------- */

async function copyFilename() {

  updateFilename();

  try {

    await navigator.clipboard.writeText(
      currentSuggestedFilename
    );

    setStatus(
      "Filename copied."
    );

  } catch (error) {

    setStatus(
      "Could not copy filename."
    );
  }
}


/* --------------------------------
   ESCAPE HTML
-------------------------------- */

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* --------------------------------
   FILE HANDLING
-------------------------------- */

const fileInput =
  document.getElementById(
    "fileInput"
  );

const uploadBox =
  document.getElementById(
    "uploadBox"
  );


fileInput.addEventListener(
  "change",
  function (event) {

    const file =
      event.target.files[0];

    if (file) {
      handleFile(file);
    }
  }
);


uploadBox.addEventListener(
  "dragover",
  function (event) {

    event.preventDefault();

    uploadBox.classList.add(
      "dragover"
    );
  }
);


uploadBox.addEventListener(
  "dragleave",
  function () {

    uploadBox.classList.remove(
      "dragover"
    );
  }
);


uploadBox.addEventListener(
  "drop",
  function (event) {

    event.preventDefault();

    uploadBox.classList.remove(
      "dragover"
    );

    const file =
      event.dataTransfer.files[0];

    if (file) {
      handleFile(file);
    }
  }
);


/* --------------------------------
   HANDLE FILE
-------------------------------- */

async function handleFile(file) {

  if (
    file.type !== "application/pdf" &&
    !file.name
      .toLowerCase()
      .endsWith(".pdf")
  ) {

    setStatus(
      "Please upload a PDF file."
    );

    return;
  }


  const result =
    document.getElementById(
      "result"
    );

  result.style.display =
    "none";


  try {

    await analyzeFile(file);

  } catch (error) {

    console.error(error);

    setStatus(
      "Something went wrong while analyzing the PDF. Please try again."
    );
  }
}

</script>
