<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDoc Organizer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 30px;
    }

    .upload-box {
      background: white;
      border: 2px dashed #9ca3af;
      border-radius: 16px;
      padding: 45px 20px;
      text-align: center;
      transition: 0.2s;
    }

    .upload-box.dragover {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .upload-box h2 {
      margin-bottom: 10px;
    }

    .upload-box p {
      color: #6b7280;
    }

    #fileInput {
      display: none;
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 22px;
      background: #2563eb;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin: 25px 0;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .stat-number {
      font-size: 28px;
      font-weight: bold;
    }

    .stat-label {
      color: #6b7280;
      margin-top: 5px;
    }

    .results {
      display: grid;
      gap: 20px;
    }

    .category {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .category h2 {
      margin-top: 0;
    }

    .file {
      border-top: 1px solid #e5e7eb;
      padding: 16px 0;
    }

    .original {
      font-weight: bold;
      word-break: break-word;
    }

    .analysis {
      margin-top: 8px;
      color: #374151;
      font-size: 14px;
    }

    .suggestion {
      margin-top: 8px;
      color: #2563eb;
      font-size: 14px;
      font-weight: bold;
      word-break: break-word;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      color: #6b7280;
      display: none;
    }

    .empty {
      color: #9ca3af;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SmartDoc Organizer</h1>

  <p class="subtitle">
    Upload documents and automatically understand and organize them.
  </p>

  <div class="upload-box" id="uploadBox">

    <h2>Drop your documents here</h2>

    <p>PDF files can now be analyzed by their contents.</p>

    <label class="button" for="fileInput">
      Choose Files
    </label>

    <input
      type="file"
      id="fileInput"
      multiple
      accept=".pdf,.txt"
    >

  </div>

  <div class="status" id="status"></div>

  <div class="stats">

    <div class="stat">
      <div class="stat-number" id="totalFiles">0</div>
      <div class="stat-label">Files</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="financeCount">0</div>
      <div class="stat-label">Finance</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="hrCount">0</div>
      <div class="stat-label">HR</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="legalCount">0</div>
      <div class="stat-label">Legal</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="otherCount">0</div>
      <div class="stat-label">Other</div>
    </div>

  </div>

  <div id="results" class="results">

    <div class="empty">
      No documents uploaded yet.
    </div>

  </div>

</div>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.105/pdf.min.mjs"
        type="module"></script>

<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.105/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.105/pdf.worker.min.mjs";


const uploadBox = document.getElementById("uploadBox");
const fileInput = document.getElementById("fileInput");
const results = document.getElementById("results");
const status = document.getElementById("status");

const totalFiles = document.getElementById("totalFiles");
const financeCount = document.getElementById("financeCount");
const hrCount = document.getElementById("hrCount");
const legalCount = document.getElementById("legalCount");
const otherCount = document.getElementById("otherCount");


const categories = [
  "Finance",
  "Human Resources",
  "Legal",
  "Marketing",
  "Operations",
  "Other"
];


fileInput.addEventListener("change", function() {

  analyzeFiles(fileInput.files);

});


uploadBox.addEventListener("dragover", function(event) {

  event.preventDefault();

  uploadBox.classList.add("dragover");

});


uploadBox.addEventListener("dragleave", function() {

  uploadBox.classList.remove("dragover");

});


uploadBox.addEventListener("drop", function(event) {

  event.preventDefault();

  uploadBox.classList.remove("dragover");

  analyzeFiles(event.dataTransfer.files);

});


async function analyzeFiles(files) {

  results.innerHTML = "";

  showStatus("Reading your documents...");

  const grouped = {};

  categories.forEach(category => {

    grouped[category] = [];

  });


  let count = 0;


  for (const file of Array.from(files)) {

    count++;

    showStatus(
      `Analyzing document ${count} of ${files.length}: ${file.name}`
    );


    let text = "";


    try {

      if (file.type === "application/pdf") {

        text = await extractPdfText(file);

      } else if (file.type === "text/plain") {

        text = await file.text();

      }

    } catch (error) {

      console.error(error);

    }


    const category = getCategory(file.name, text);

    const suggested = createSuggestedName(
      file.name,
      category,
      text
    );


    grouped[category].push({

      original: file.name,

      suggested: suggested,

      textFound: text.length > 0

    });

  }


  displayResults(grouped);

  showStatus(
    `Finished analyzing ${files.length} document(s).`
  );

}


async function extractPdfText(file) {

  const arrayBuffer = await file.arrayBuffer();

  const pdf = await pdfjsLib.getDocument({
    data: arrayBuffer
  }).promise;


  let fullText = "";


  const maxPages = Math.min(pdf.numPages, 10);


  for (let pageNumber = 1; pageNumber <= maxPages; pageNumber++) {

    const page = await pdf.getPage(pageNumber);

    const content = await page.getTextContent();


    const pageText = content.items
      .map(item => item.str)
      .join(" ");


    fullText += pageText + "\n";

  }


  return fullText;

}


function getCategory(filename, text) {

  const combined =
    (filename + " " + text).toLowerCase();


  if (
    combined.includes("invoice") ||
    combined.includes("receipt") ||
    combined.includes("payment") ||
    combined.includes("salary") ||
    combined.includes("budget") ||
    combined.includes("tax") ||
    combined.includes("amount due")
  ) {

    return "Finance";

  }


  if (
    combined.includes("cv") ||
    combined.includes("resume") ||
    combined.includes("employee") ||
    combined.includes("human resources") ||
    combined.includes("payroll") ||
    combined.includes("job application")
  ) {

    return "Human Resources";

  }


  if (
    combined.includes("contract") ||
    combined.includes("agreement") ||
    combined.includes("legal") ||
    combined.includes("nda") ||
    combined.includes("terms and conditions")
  ) {

    return "Legal";

  }


  if (
    combined.includes("marketing") ||
    combined.includes("campaign") ||
    combined.includes("advertising") ||
    combined.includes("social media")
  ) {

    return "Marketing";

  }


  if (
    combined.includes("project") ||
    combined.includes("meeting") ||
    combined.includes("operations") ||
    combined.includes("internal report")
  ) {

    return "Operations";

  }


  return "Other";

}


function createSuggestedName(filename, category, text) {

  const extension =
    filename.includes(".")
      ? filename.substring(filename.lastIndexOf("."))
      : "";


  let baseName = "";


  if (category === "Finance") {

    baseName = "Finance_Document";

  } else if (category === "Human Resources") {

    baseName = "HR_Document";

  } else if (category === "Legal") {

    baseName = "Legal_Document";

  } else if (category === "Marketing") {

    baseName = "Marketing_Document";

  } else if (category === "Operations") {

    baseName = "Operations_Document";

  } else {

    baseName = "Organized_Document";

  }


  const dateMatch = text.match(
    /\b(20\d{2}[-/]\d{1,2}[-/]\d{1,2})\b/
  );


  if (dateMatch) {

    baseName += "_" + dateMatch[1].replaceAll("/", "-");

  }


  return baseName + extension.toLowerCase();

}


function displayResults(grouped) {

  results.innerHTML = "";

  let total = 0;


  categories.forEach(category => {

    const files = grouped[category];

    total += files.length;


    if (files.length === 0) {
      return;
    }


    const categoryBox =
      document.createElement("div");

    categoryBox.className = "category";


    categoryBox.innerHTML =
      `<h2>${category} (${files.length})</h2>`;


    files.forEach(file => {

      const fileBox =
        document.createElement("div");

      fileBox.className = "file";


      const contentStatus =
        file.textFound
          ? "✓ Document text analyzed"
          : "Filename analyzed";


      fileBox.innerHTML = `

        <div class="original">
          ${escapeHtml(file.original)}
        </div>

        <div class="analysis">
          ${contentStatus}
        </div>

        <div class="suggestion">
          Suggested name: ${escapeHtml(file.suggested)}
        </div>

      `;


      categoryBox.appendChild(fileBox);

    });


    results.appendChild(categoryBox);

  });


  totalFiles.textContent = total;

  financeCount.textContent =
    grouped["Finance"].length;

  hrCount.textContent =
    grouped["Human Resources"].length;

  legalCount.textContent =
    grouped["Legal"].length;

  otherCount.textContent =
    grouped["Other"].length +
    grouped["Marketing"].length +
    grouped["Operations"].length;

}


function showStatus(message) {

  status.style.display = "block";

  status.textContent = message;

}


function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
</html>
