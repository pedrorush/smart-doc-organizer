<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDoc Organizer</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 40px 20px;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .upload-box {
      background: white;
      border: 2px dashed #999;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 25px;
    }

    .upload-box:hover {
      border-color: #333;
    }

    input[type="file"] {
      margin-top: 15px;
    }

    .status {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .document {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .document h2 {
      margin-top: 0;
    }

    .field {
      margin: 8px 0;
    }

    .label {
      font-weight: bold;
    }

    .filename {
      background: #f0f2f4;
      padding: 10px;
      border-radius: 6px;
      margin-top: 12px;
      font-family: monospace;
    }

    .category {
      display: inline-block;
      background: #e9ecef;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    progress {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SmartDoc Organizer</h1>

  <div class="subtitle">
    Upload documents and automatically understand, categorize and rename them.
  </div>

  <div class="upload-box">
    <strong>Upload your documents</strong>
    <br>
    <span>PDF files are supported</span>
    <br>
    <input type="file" id="fileInput" accept=".pdf" multiple>
  </div>

  <div id="status" class="status"></div>

  <div id="results"></div>

</div>

<script type="module">

  import * as pdfjsLib from
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs";

  const fileInput = document.getElementById("fileInput");
  const results = document.getElementById("results");
  const status = document.getElementById("status");

  function showStatus(message) {
    status.style.display = "block";
    status.innerHTML = message;
  }

  function hideStatus() {
    status.style.display = "none";
  }

  function detectCategory(text) {

    const lower = text.toLowerCase();

    if (
      lower.includes("invoice") ||
      lower.includes("amount due") ||
      lower.includes("subtotal") ||
      lower.includes("tax")
    ) {
      return "Finance";
    }

    if (
      lower.includes("resume") ||
      lower.includes("curriculum vitae") ||
      lower.includes("experience") ||
      lower.includes("education")
    ) {
      return "Human Resources";
    }

    if (
      lower.includes("contract") ||
      lower.includes("agreement") ||
      lower.includes("terms and conditions")
    ) {
      return "Legal";
    }

    if (
      lower.includes("campaign") ||
      lower.includes("advertising") ||
      lower.includes("marketing")
    ) {
      return "Marketing";
    }

    if (
      lower.includes("purchase order") ||
      lower.includes("shipping") ||
      lower.includes("delivery") ||
      lower.includes("operations")
    ) {
      return "Operations";
    }

    if (
      lower.includes("receipt") ||
      lower.includes("total")
    ) {
      return "Finance";
    }

    return "Other";
  }

  function extractInvoiceNumber(text) {

    const patterns = [
      /invoice\s*(?:number|no|#)?\s*[:\-]?\s*([A-Z0-9\-\/]+)/i,
      /inv[\s\-]*(?:number|no|#)?\s*[:\-]?\s*([A-Z0-9\-\/]+)/i
    ];

    for (const pattern of patterns) {
      const match = text.match(pattern);

      if (match) {
        return match[1];
      }
    }

    return "Not detected";
  }

  function extractDate(text) {

    const patterns = [
      /\b\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}\b/,
      /\b\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}\b/
    ];

    for (const pattern of patterns) {
      const match = text.match(pattern);

      if (match) {
        return match[0];
      }
    }

    return "Not detected";
  }

  function extractAmount(text) {

    const patterns = [
      /(?:total|amount due|grand total)[^\d]{0,20}([$€£]\s?[\d,]+(?:\.\d{2})?)/i,
      /([$€£]\s?[\d,]+(?:\.\d{2})?)/
    ];

    for (const pattern of patterns) {

      const match = text.match(pattern);

      if (match) {
        return match[1];
      }
    }

    return "Not detected";
  }

  function extractCompany(text) {

    const lines = text
      .split(/\n+/)
      .map(line => line.trim())
      .filter(line => line.length > 2);

    const companyKeywords = [
      "company",
      "supplier",
      "vendor",
      "from",
      "seller"
    ];

    for (const line of lines) {

      const lower = line.toLowerCase();

      for (const keyword of companyKeywords) {

        if (lower.startsWith(keyword)) {

          const value = line
            .replace(new RegExp("^" + keyword, "i"), "")
            .replace(/^[:\-\s]+/, "")
            .trim();

          if (value.length > 2) {
            return value;
          }
        }
      }
    }

    return "Not detected";
  }

  function createFilename(category, company, date, invoiceNumber) {

    let type = "Document";

    if (category === "Finance") {
      type = "Invoice";
    }

    if (category === "Human Resources") {
      type = "Resume";
    }

    if (category === "Legal") {
      type = "Contract";
    }

    let parts = [];

    if (company !== "Not detected") {
      parts.push(company.replace(/[^a-zA-Z0-9]+/g, "-"));
    }

    parts.push(type);

    if (invoiceNumber !== "Not detected") {
      parts.push(invoiceNumber);
    }

    if (date !== "Not detected") {
      parts.push(date.replace(/[\/]/g, "-"));
    }

    return parts.join("_") + ".pdf";
  }

  async function extractPDFText(file) {

    const buffer = await file.arrayBuffer();

    const pdf = await pdfjsLib
      .getDocument({ data: buffer })
      .promise;

    let text = "";

    const pagesToRead = Math.min(pdf.numPages, 10);

    for (let pageNumber = 1; pageNumber <= pagesToRead; pageNumber++) {

      const page = await pdf.getPage(pageNumber);

      const content = await page.getTextContent();

      const pageText = content.items
        .map(item => item.str)
        .join(" ");

      text += "\n" + pageText;
    }

    return {
      text: text.trim(),
      pdf: pdf
    };
  }

  async function renderPageToCanvas(pdf, pageNumber) {

    const page = await pdf.getPage(pageNumber);

    const viewport = page.getViewport({
      scale: 2
    });

    const canvas = document.createElement("canvas");

    const context = canvas.getContext("2d");

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({
      canvasContext: context,
      viewport: viewport
    }).promise;

    return canvas;
  }

  async function runOCR(pdf) {

    showStatus(
      "Scanned PDF detected. Starting OCR...<br>" +
      "This can take a little while."
    );

    const worker = await Tesseract.createWorker("eng");

    let text = "";

    const pagesToRead = Math.min(pdf.numPages, 3);

    for (let pageNumber = 1; pageNumber <= pagesToRead; pageNumber++) {

      showStatus(
        "OCR processing page " +
        pageNumber +
        " of " +
        pagesToRead +
        "..."
      );

      const canvas = await renderPageToCanvas(pdf, pageNumber);

      const result = await worker.recognize(canvas);

      text += "\n" + result.data.text;
    }

    await worker.terminate();

    return text.trim();
  }

  function displayResult(file, text, usedOCR) {

    const category = detectCategory(text);

    const invoiceNumber = extractInvoiceNumber(text);

    const date = extractDate(text);

    const amount = extractAmount(text);

    const company = extractCompany(text);

    const suggestedFilename =
      createFilename(
        category,
        company,
        date,
        invoiceNumber
      );

    const document = document.createElement("div");

    document.className = "document";

    document.innerHTML = `

      <span class="category">
        ${category}
      </span>

      <h2>${file.name}</h2>

      <div class="field">
        <span class="label">Analysis:</span>
        ${usedOCR ? "OCR scan" : "PDF text"}
      </div>

      <div class="field">
        <span class="label">Document type:</span>
        ${category}
      </div>

      <div class="field">
        <span class="label">Company:</span>
        ${company}
      </div>

      <div class="field">
        <span class="label">Invoice number:</span>
        ${invoiceNumber}
      </div>

      <div class="field">
        <span class="label">Date:</span>
        ${date}
      </div>

      <div class="field">
        <span class="label">Amount:</span>
        ${amount}
      </div>

      <div class="field">
        <span class="label">Suggested filename:</span>
      </div>

      <div class="filename">
        ${suggestedFilename}
      </div>

    `;

    results.appendChild(document);
  }

  async function processFile(file) {

    try {

      results.innerHTML = "";

      showStatus(
        "Reading <strong>" +
        file.name +
        "</strong>..."
      );

      const extracted = await extractPDFText(file);

      let text = extracted.text;

      let usedOCR = false;

      if (!text || text.length < 30) {

        usedOCR = true;

        text = await runOCR(extracted.pdf);
      }

      hideStatus();

      displayResult(
        file,
        text,
        usedOCR
      );

    } catch (error) {

      console.error(error);

      showStatus(
        "Something went wrong while reading this PDF.<br><br>" +
        error.message
      );
    }
  }

  fileInput.addEventListener("change", async function() {

    const files = Array.from(fileInput.files);

    if (!files.length) {
      return;
    }

    for (const file of files) {

      await processFile(file);
    }

  });

</script>

</body>
</html>
