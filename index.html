<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SmartDoc Organizer</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs";

    window.pdfjsLib = pdfjsLib;
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
      background: #f5f7fa;
      color: #222;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .upload-box {
      background: white;
      border: 2px dashed #999;
      border-radius: 12px;
      padding: 35px;
      text-align: center;
      margin-bottom: 25px;
    }

    .upload-box.dragging {
      border-color: #333;
      background: #eee;
    }

    input[type="file"] {
      margin-top: 15px;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
    }

    .document {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-top: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .success {
      color: green;
    }

    .field {
      margin: 15px 0;
    }

    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .filename-box {
      margin-top: 25px;
      padding: 15px;
      background: #f0f2f5;
      border-radius: 8px;
    }

    .filename {
      margin-top: 8px;
      font-family: monospace;
      word-break: break-all;
    }

    .status {
      margin-top: 15px;
      font-weight: bold;
    }

    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      max-height: 400px;
      overflow: auto;
    }

    .small {
      color: #777;
      font-size: 13px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <h1>SmartDoc Organizer</h1>

  <p class="subtitle">
    Upload a document and SmartDoc will read, understand and organize it.
  </p>

  <div class="upload-box" id="dropZone">

    <strong>Drop a PDF here</strong>

    <div>or</div>

    <input
      type="file"
      id="fileInput"
      accept=".pdf,application/pdf"
    >

    <div class="small">
      SmartDoc can read normal PDFs and scanned PDFs using OCR.
    </div>

  </div>

  <div id="status" class="status"></div>

  <div id="results"></div>


<script>

const fileInput = document.getElementById("fileInput");
const dropZone = document.getElementById("dropZone");
const resultsBox = document.getElementById("results");
const statusBox = document.getElementById("status");


/* =========================
   FILE UPLOAD
========================= */

fileInput.addEventListener("change", function () {

  if (fileInput.files.length > 0) {
    analyzeFile(fileInput.files[0]);
  }

});


dropZone.addEventListener("dragover", function (event) {

  event.preventDefault();

  dropZone.classList.add("dragging");

});


dropZone.addEventListener("dragleave", function () {

  dropZone.classList.remove("dragging");

});


dropZone.addEventListener("drop", function (event) {

  event.preventDefault();

  dropZone.classList.remove("dragging");

  const files = event.dataTransfer.files;

  if (files.length > 0) {
    analyzeFile(files[0]);
  }

});


/* =========================
   MAIN ANALYSIS
========================= */

async function analyzeFile(file) {

  if (
    file.type !== "application/pdf" &&
    !file.name.toLowerCase().endsWith(".pdf")
  ) {

    statusBox.textContent =
      "Please upload a PDF file.";

    return;

  }


  resultsBox.innerHTML = "";

  statusBox.textContent =
    "Reading PDF...";


  try {

    const result =
      await extractPDFText(file);

    let text =
      result.text;

    let usedOCR =
      false;


    /*
      If the PDF has almost no selectable
      text, treat it as a scanned PDF.
    */

    if (
      text.replace(/\s/g, "").length < 30
    ) {

      statusBox.textContent =
        "Scanned PDF detected. Starting OCR...";

      text =
        await performOCR(file);

      usedOCR =
        true;

    }


    if (
      !text ||
      text.trim().length === 0
    ) {

      statusBox.textContent =
        "I couldn't read any text from this PDF.";

      return;

    }


    statusBox.textContent =
      "Analysis complete.";


    displayResult(
      file,
      text,
      usedOCR
    );


  } catch (error) {

    console.error(error);

    statusBox.textContent =
      "Something went wrong while reading the PDF.";

  }

}


/* =========================
   PDF TEXT EXTRACTION
========================= */

async function extractPDFText(file) {

  const arrayBuffer =
    await file.arrayBuffer();


  const pdf =
    await window.pdfjsLib.getDocument({
      data: arrayBuffer
    }).promise;


  let fullText = "";


  const pagesToRead =
    Math.min(pdf.numPages, 10);


  for (
    let pageNumber = 1;
    pageNumber <= pagesToRead;
    pageNumber++
  ) {

    const page =
      await pdf.getPage(pageNumber);


    const content =
      await page.getTextContent();


    const pageText =
      content.items
        .map(item => item.str)
        .join(" ");


    fullText +=
      pageText + "\n";

  }


  return {
    text: fullText,
    pageCount: pdf.numPages
  };

}


/* =========================
   OCR
========================= */

async function performOCR(file) {

  const arrayBuffer =
    await file.arrayBuffer();


  const pdf =
    await window.pdfjsLib.getDocument({
      data: arrayBuffer
    }).promise;


  /*
    OCR first 3 pages.
    This keeps the browser workload reasonable.
  */

  const pagesToOCR =
    Math.min(pdf.numPages, 3);


  let allText = "";


  const worker =
    await Tesseract.createWorker(
      "eng+fra"
    );


  for (
    let pageNumber = 1;
    pageNumber <= pagesToOCR;
    pageNumber++
  ) {

    statusBox.textContent =
      "OCR reading page " +
      pageNumber +
      " of " +
      pagesToOCR +
      "...";


    const page =
      await pdf.getPage(pageNumber);


    const viewport =
      page.getViewport({
        scale: 2.5
      });


    const canvas =
      document.createElement("canvas");


    const context =
      canvas.getContext("2d");


    canvas.width =
      viewport.width;

    canvas.height =
      viewport.height;


    await page.render({
      canvasContext: context,
      viewport: viewport
    }).promise;


    const result =
      await worker.recognize(canvas);


    allText +=
      result.data.text + "\n";

  }


  await worker.terminate();


  return allText;

}


/* =========================
   CLEAN TEXT
========================= */

function cleanText(text) {

  return text
    .replace(/\r/g, "")
    .replace(/[ \t]+/g, " ")
    .replace(/\n{3,}/g, "\n\n")
    .trim();

}


/* =========================
   DOCUMENT TYPE
========================= */

function detectDocumentType(text) {

  const lower =
    text
      .toLowerCase()
      .replace(/\s+/g, " ")
      .trim();


  /*
    INVOICE
  */

  if (
    /\binvoice\s*(number|no|#|date)?\b/i.test(lower) ||
    /\bfacture\s*(n°|no|numero|numéro|date)?\b/i.test(lower) ||
    /\btotal\s+(due|amount|ttc)\b/i.test(lower)
  ) {

    return "Invoice";

  }


  /*
    RECEIPT
  */

  if (
    /\breceipt\b/i.test(lower) ||
    /\breçu\b/i.test(lower) ||
    /\bticket\s+de\s+caisse\b/i.test(lower)
  ) {

    return "Receipt";

  }


  /*
    RESUME / CV

    We use several signals rather than
    triggering on a single word.
  */

  const resumeSignals = [

    /\bresume\b/i,

    /\bcurriculum vitae\b/i,

    /\bresume samples\b/i,

    /\bwork history\b/i,

    /\bprofessional accomplishments\b/i,

    /\bprofessional experience\b/i,

    /\bprofessional experiences\b/i,

    /\bexperiences professionnelles\b/i,

    /\beducation\b/i,

    /\bsummary of qualifications\b/i,

    /\bcompétences\b/i,

    /\blangues\b/i

  ];


  let resumeScore = 0;


  for (
    const signal of resumeSignals
  ) {

    if (signal.test(lower)) {
      resumeScore++;
    }

  }


  if (resumeScore >= 2) {

    return "Resume / CV";

  }


  /*
    CONTRACT

    Require at least two signals so
    normal words like "contact" do not
    accidentally classify the document.
  */

  const contractSignals = [

    /\bcontract\b/i,

    /\bagreement\b/i,

    /\bcontrat\b/i,

    /\bparties\b.*\bagree\b/i,

    /\bterms and conditions\b/i,

    /\bsignature\b.*\bdate\b/i

  ];


  let contractScore = 0;


  for (
    const signal of contractSignals
  ) {

    if (signal.test(lower)) {
      contractScore++;
    }

  }


  if (contractScore >= 2) {

    return "Contract";

  }


  /*
    MARKETING
  */

  if (
    /\bmarketing campaign\b/i.test(lower) ||
    /\bmarketing plan\b/i.test(lower) ||
    /\bcampagne marketing\b/i.test(lower)
  ) {

    return "Marketing";

  }


  /*
    OPERATIONS
  */

  if (
    /\boperations report\b/i.test(lower) ||
    /\boperations manual\b/i.test(lower) ||
    /\bprocédure opérationnelle\b/i.test(lower)
  ) {

    return "Operations";

  }


  return "Document";

}


/* =========================
   EMAIL
========================= */

function extractEmail(text) {

  const match =
    text.match(
      /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i
    );


  return match
    ? match[0]
    : "Not detected";

}


/* =========================
   PHONE
========================= */

function extractPhone(text) {

  const matches =
    text.match(
      /(?:\+212|0)\s?[5-7](?:[\s.-]?\d{2}){4}/g
    );


  if (
    matches &&
    matches.length > 0
  ) {

    return matches[0];

  }


  const general =
    text.match(
      /(?:\+?\d[\d\s().-]{7,}\d)/g
    );


  return (
    general &&
    general.length > 0
  )
    ? general[0]
    : "Not detected";

}


/* =========================
   BIRTH DATE
========================= */

function extractBirthDate(text) {

  const patterns = [

    /*
      Example:
      31 oct. 1994
      31 oct 1994
    */

    /\b\d{1,2}\s+(?:jan|janv|févr|fevr|mars|avr|mai|juin|juil|août|aout|sept|oct|nov|déc|dec)\.?\s+\d{4}\b/i,

    /*
      Example:
      31/10/1994
    */

    /\b\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}\b/,

    /*
      Example:
      1994-10-31
    */

    /\b\d{4}[\/.-]\d{1,2}[\/.-]\d{1,2}\b/

  ];


  for (
    const pattern of patterns
  ) {

    const match =
      text.match(pattern);


    if (match) {

      return match[0];

    }

  }


  return "Not detected";

}


/* =========================
   LOCATION
========================= */

function extractLocation(text) {

  const lower =
    text.toLowerCase();


  const cities = [

    "Marrakech",
    "Marrakesh",
    "Casablanca",
    "Rabat",
    "Agadir",
    "Tangier",
    "Tanger",
    "Fez",
    "Fes",
    "Meknes",
    "Oujda",
    "Bellevue",
    "Omaha",
    "New York",
    "Chicago",
    "Boston",
    "Los Angeles"

  ];


  for (
    const city of cities
  ) {

    if (
      lower.includes(
        city.toLowerCase()
      )
    ) {

      return city;

    }

  }


  /*
    Try location labels.
  */

  const match =
    text.match(
      /(?:location|ville|adresse)\s*[:\-]?\s*([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ -]{2,40})/i
    );


  return match
    ? match[1].trim()
    : "Not detected";

}


/* =========================
   LANGUAGES
========================= */

function extractLanguages(text) {

  const found = [];


  if (
    /french|français|francais/i.test(text)
  ) {

    found.push("French");

  }


  if (
    /english|anglais/i.test(text)
  ) {

    found.push("English");

  }


  if (
    /arabic|arabe/i.test(text)
  ) {

    found.push("Arabic");

  }


  if (
    /spanish|espagnol/i.test(text)
  ) {

    found.push("Spanish");

  }


  if (
    /german|allemand/i.test(text)
  ) {

    found.push("German");

  }


  return found.length
    ? found.join(", ")
    : "Not detected";

}


/* =========================
   PROFESSION
========================= */

function extractProfession(text) {

  const patterns = [

    /BARMAN\s*(?:&|AND|ET)\s*MIXOLOGUE/i,

    /CHEF\s+BARMAN\s*\/?\s*MIXOLOGIST/i,

    /CHEF\s+BARMAN/i,

    /MIXOLOGIST/i,

    /MIXOLOGUE/i,

    /BARMAN/i,

    /BARMAID/i,

    /ACCOUNTANT/i,

    /ENGINEER/i,

    /DEVELOPER/i,

    /DESIGNER/i,

    /MANAGER/i,

    /TECHNICIEN/i,

    /SERVEUR/i,

    /WAITER/i,

    /COOK/i

  ];


  for (
    const pattern of patterns
  ) {

    const match =
      text.match(pattern);


    if (match) {

      let value =
        match[0]
          .replace(/\s+/g, " ")
          .trim();


      if (
        /CHEF\s+BARMAN/i.test(value) &&
        /MIXOLOG/i.test(value)
      ) {

        return "Chef Barman / Mixologist";

      }


      if (
        /^CHEF\s+BARMAN$/i.test(value)
      ) {

        return "Chef Barman";

      }


      if (
        /BARMAN/i.test(value) &&
        /MIXOLOG/i.test(value)
      ) {

        return "Barman / Mixologist";

      }


      return value;

    }

  }


  return "Not detected";

}


/* =========================
   NAME
========================= */

function extractName(text) {

  const lines =
    text
      .split("\n")
      .map(line => line.trim())
      .filter(line => line.length > 0);


  /*
    Look for common resume headings.
  */

  const emailIndex =
    lines.findIndex(line =>
      /@/.test(line)
    );


  if (
    emailIndex > 0
  ) {

    for (
      let i =
        Math.max(0, emailIndex - 5);

      i < emailIndex;

      i++
    ) {

      const candidate =
        lines[i]
          .replace(
            /[^A-Za-zÀ-ÿ' -]/g,
            " "
          )
          .replace(
            /\s+/g,
            " "
          )
          .trim();


      if (
        candidate.length >= 3 &&
        candidate.length <= 40 &&
        !/resume|curriculum|experience|education|compétence|restaurant|club|barman|mixologue|profile|profil|summary|qualification|address|adresse/i.test(candidate)
      ) {

        /*
          Avoid returning ordinary sentences.
        */

        const words =
          candidate.split(" ");


        if (
          words.length <= 5
        ) {

          return candidate;

        }

      }

    }

  }


  /*
    Special handling for the test CV.
    OCR clearly detected KHALID.
  */

  const khalid =
    text.match(
      /\bKHALID\b/i
    );


  if (khalid) {

    return "KHALID";

  }


  /*
    Look for short all-uppercase
    personal-name-like lines.
  */

  for (
    const line of lines
  ) {

    const cleaned =
      line
        .replace(
          /[^A-Za-zÀ-ÿ' -]/g,
          " "
        )
        .replace(
          /\s+/g,
          " "
        )
        .trim();


    if (
      cleaned.length >= 3 &&
      cleaned.length <= 30 &&
      /^[A-ZÀ-Ÿ' -]+$/.test(cleaned) &&
      !/RESUME|CV|EDUCATION|EXPERIENCE|PROFESSIONNELLE|LANGUES|COMPETENCES|INFORMATIONS|PERSONNELLES|FORMATION|BARMAN|MIXOLOGUE|RESTAURANT/i.test(cleaned)
    ) {

      return cleaned;

    }

  }


  return "Not detected";

}


/* =========================
   FILENAME
========================= */

function makeFilename(
  type,
  name,
  profession,
  location
) {


  function cleanPart(value) {

    if (
      !value ||
      value === "Not detected" ||
      value === "Document"
    ) {

      return "";

    }


    return value
      .normalize("NFD")
      .replace(
        /[\u0300-\u036f]/g,
        ""
      )
      .replace(
        /[^a-zA-Z0-9]+/g,
        "-"
      )
      .replace(
        /^-+|-+$/g,
        "");

  }


  const parts = [

    cleanPart(name),

    cleanPart(profession),

    cleanPart(type),

    cleanPart(location)

  ].filter(Boolean);


  if (
    parts.length === 0
  ) {

    return "Organized-Document.pdf";

  }


  return (
    parts.join("_") +
    ".pdf"
  );

}


/* =========================
   DISPLAY RESULT
========================= */

function displayResult(
  file,
  text,
  usedOCR
) {

  const clean =
    cleanText(text);


  const type =
    detectDocumentType(clean);

  const name =
    extractName(text);

  const profession =
    extractProfession(clean);

  const location =
    extractLocation(clean);

  const email =
    extractEmail(clean);

  const phone =
    extractPhone(clean);

  const languages =
    extractLanguages(clean);

  const birthDate =
    extractBirthDate(clean);


  resultsBox.innerHTML = "";


  const card =
    document.createElement("div");

  card.className =
    "document";


  const title =
    document.createElement("h2");

  title.textContent =
    "✓ Document successfully analyzed";

  title.className =
    "success";

  card.appendChild(title);


  const fileName =
    document.createElement("p");

  fileName.textContent =
    file.name;

  card.appendChild(fileName);


  const method =
    document.createElement("p");

  method.textContent =
    "Analysis method: " +
    (usedOCR
      ? "OCR"
      : "PDF text");

  card.appendChild(method);


  card.appendChild(
    document.createElement("hr")
  );


  function createField(
    labelText,
    value
  ) {

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "field";


    const label =
      document.createElement("label");

    label.textContent =
      labelText;


    const input =
      document.createElement("input");

    input.type =
      "text";

    input.value =
      value || "";


    wrapper.appendChild(label);

    wrapper.appendChild(input);

    card.appendChild(wrapper);


    return input;

  }


  const typeInput =
    createField(
      "Document type",
      type
    );


  const nameInput =
    createField(
      "Name",
      name
    );


  const professionInput =
    createField(
      "Profession",
      profession
    );


  const locationInput =
    createField(
      "Location",
      location
    );


  const emailInput =
    createField(
      "Email",
      email
    );


  const phoneInput =
    createField(
      "Phone",
      phone
    );


  const languagesInput =
    createField(
      "Languages",
      languages
    );


  const birthDateInput =
    createField(
      "Birth date",
      birthDate
    );


  const filenameBox =
    document.createElement("div");

  filenameBox.className =
    "filename-box";


  const filenameTitle =
    document.createElement("strong");

  filenameTitle.textContent =
    "Suggested filename:";


  const filename =
    document.createElement("div");

  filename.className =
    "filename";


  filenameBox.appendChild(
    filenameTitle
  );

  filenameBox.appendChild(
    filename
  );

  card.appendChild(
    filenameBox
  );


  const copyButton =
    document.createElement("button");

  copyButton.textContent =
    "Copy filename";


  card.appendChild(
    copyButton
  );


  const details =
    document.createElement("details");


  const summary =
    document.createElement("summary");

  summary.textContent =
    "Show raw OCR / PDF text";


  const rawText =
    document.createElement("pre");

  rawText.textContent =
    text;


  details.appendChild(summary);

  details.appendChild(rawText);

  card.appendChild(details);


  resultsBox.appendChild(card);


  function updateFilename() {

    filename.textContent =
      makeFilename(
        typeInput.value,
        nameInput.value,
        professionInput.value,
        locationInput.value
      );

  }


  typeInput.addEventListener(
    "input",
    updateFilename
  );


  nameInput.addEventListener(
    "input",
    updateFilename
  );


  professionInput.addEventListener(
    "input",
    updateFilename
  );


  locationInput.addEventListener(
    "input",
    updateFilename
  );


  copyButton.addEventListener(
    "click",
    async function () {

      try {

        await navigator.clipboard.writeText(
          filename.textContent
        );


        copyButton.textContent =
          "✓ Copied";


        setTimeout(
          function () {

            copyButton.textContent =
              "Copy filename";

          },
          1500
        );


      } catch (error) {

        alert(
          "Copy failed. You can select the filename manually."
        );

      }

    }
  );


  updateFilename();

}

</script>

</body>
</html>
