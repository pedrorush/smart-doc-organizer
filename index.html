<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDoc Organizer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 30px;
    }

    .upload-box {
      background: white;
      border: 2px dashed #9ca3af;
      border-radius: 16px;
      padding: 45px 20px;
      text-align: center;
    }

    .upload-box.dragover {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .upload-box h2 {
      margin-bottom: 10px;
    }

    .upload-box p {
      color: #6b7280;
    }

    #fileInput {
      display: none;
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 22px;
      background: #2563eb;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      display: none;
    }

    .results {
      margin-top: 25px;
      display: grid;
      gap: 20px;
    }

    .category {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .file {
      border-top: 1px solid #e5e7eb;
      padding: 16px 0;
    }

    .original {
      font-weight: bold;
      word-break: break-word;
      margin-bottom: 10px;
    }

    .field {
      margin: 6px 0;
      font-size: 14px;
    }

    .suggestion {
      margin-top: 12px;
      padding: 12px;
      background: #eff6ff;
      border-radius: 8px;
      color: #1d4ed8;
      font-weight: bold;
      word-break: break-word;
    }

    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      color: #9ca3af;
      border-radius: 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SmartDoc Organizer</h1>

  <p class="subtitle">
    Upload documents and automatically understand and organize them.
  </p>

  <div class="upload-box" id="uploadBox">

    <h2>Drop your documents here</h2>

    <p>PDF text will be analyzed directly in your browser.</p>

    <label class="button" for="fileInput">
      Choose Files
    </label>

    <input
      id="fileInput"
      type="file"
      multiple
      accept=".pdf,.txt"
    >

  </div>

  <div class="status" id="status"></div>

  <div id="results" class="results">

    <div class="empty">
      No documents uploaded yet.
    </div>

  </div>

</div>


<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs";


const fileInput =
document.getElementById("fileInput");

const uploadBox =
document.getElementById("uploadBox");

const results =
document.getElementById("results");

const status =
document.getElementById("status");


fileInput.addEventListener("change", () => {

  analyzeFiles(fileInput.files);

});


uploadBox.addEventListener("dragover", event => {

  event.preventDefault();

  uploadBox.classList.add("dragover");

});


uploadBox.addEventListener("dragleave", () => {

  uploadBox.classList.remove("dragover");

});


uploadBox.addEventListener("drop", event => {

  event.preventDefault();

  uploadBox.classList.remove("dragover");

  analyzeFiles(event.dataTransfer.files);

});


async function analyzeFiles(files) {

  results.innerHTML = "";

  showStatus("Starting document analysis...");


  for (const file of files) {

    showStatus("Reading: " + file.name);


    try {

      let text = "";


      if (file.type === "application/pdf") {

        text = await readPDF(file);

      } else if (file.type === "text/plain") {

        text = await file.text();

      }


      const info =
        analyzeText(text, file.name);


      displayResult(file.name, info);


    } catch (error) {

      console.error(error);

      displayError(
        file.name,
        "Could not read this document."
      );

    }

  }


  showStatus(
    "Finished analyzing " + files.length + " document(s)."
  );

}


async function readPDF(file) {

  const buffer =
    await file.arrayBuffer();


  const pdf =
    await pdfjsLib.getDocument({
      data: buffer
    }).promise;


  let text = "";


  const pages =
    Math.min(pdf.numPages, 10);


  for (
    let pageNumber = 1;
    pageNumber <= pages;
    pageNumber++
  ) {

    const page =
      await pdf.getPage(pageNumber);


    const content =
      await page.getTextContent();


    const pageText =
      content.items
        .map(item => item.str)
        .join(" ");


    text += pageText + "\n";

  }


  return text;

}


function analyzeText(text, filename) {

  const lower =
    (text + " " + filename).toLowerCase();


  let type = "Document";
  let category = "Other";


  if (
    lower.includes("invoice") ||
    lower.includes("amount due") ||
    lower.includes("invoice number")
  ) {

    type = "Invoice";
    category = "Finance";

  }

  else if (
    lower.includes("receipt") ||
    lower.includes("payment received")
  ) {

    type = "Receipt";
    category = "Finance";

  }

  else if (
    lower.includes("contract") ||
    lower.includes("agreement")
  ) {

    type = "Contract";
    category = "Legal";

  }

  else if (
    lower.includes("resume") ||
    lower.includes("curriculum vitae")
  ) {

    type = "Resume";
    category = "Human Resources";

  }

  else if (
    lower.includes("marketing") ||
    lower.includes("campaign")
  ) {

    type = "Marketing Document";
    category = "Marketing";

  }

  else if (
    lower.includes("meeting") ||
    lower.includes("project report")
  ) {

    type = "Operations Document";
    category = "Operations";

  }


  const invoiceNumber =
    extractInvoiceNumber(text);


  const date =
    extractDate(text);


  const amount =
    extractAmount(text);


  const company =
    extractCompany(text);


  const suggested =
    buildFilename(
      type,
      company,
      date,
      invoiceNumber,
      filename
    );


  return {
    type,
    category,
    invoiceNumber,
    date,
    amount,
    company,
    suggested
  };

}


function extractInvoiceNumber(text) {

  const match =
    text.match(
      /invoice\s*(?:number|no\.?|#)?\s*[:\-]?\s*([A-Z0-9\-\/]+)/i
    );


  return match ? match[1] : "";

}


function extractDate(text) {

  const patterns = [

    /\b20\d{2}[-\/]\d{1,2}[-\/]\d{1,2}\b/,

    /\b\d{1,2}[-\/]\d{1,2}[-\/]20\d{2}\b/,

    /\b(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{1,2},?\s+20\d{2}\b/i

  ];


  for (const pattern of patterns) {

    const match =
      text.match(pattern);

    if (match) {
      return match[0];
    }

  }


  return "";

}


function extractAmount(text) {

  const match =
    text.match(
      /(?:total|amount due|total due|grand total)\s*[:\-]?\s*([$€£]\s?[\d,]+(?:\.\d{2})?)/i
    );


  return match ? match[1] : "";

}


function extractCompany(text) {

  const lines =
    text.split(/\n+/);


  for (const line of lines) {

    const clean =
      line.trim();


    if (
      /^company\s*:/i.test(clean) ||
      /^vendor\s*:/i.test(clean) ||
      /^supplier\s*:/i.test(clean) ||
      /^from\s*:/i.test(clean)
    ) {

      return clean
        .split(":")
        .slice(1)
        .join(":")
        .trim();

    }

  }


  return "";

}


function buildFilename(
  type,
  company,
  date,
  invoiceNumber,
  original
) {

  const parts = [type];


  if (company) {
    parts.push(company);
  }


  if (date) {
    parts.push(date);
  }


  if (invoiceNumber) {
    parts.push("No-" + invoiceNumber);
  }


  const extension =
    original.includes(".")
      ? original.substring(
          original.lastIndexOf(".")
        )
      : ".pdf";


  return parts
    .map(cleanPart)
    .join("_") +
    extension.toLowerCase();

}


function cleanPart(value) {

  return value
    .replace(/[^\w\s-]/g, "")
    .replace(/\s+/g, "-")
    .substring(0, 50);

}


function displayResult(filename, info) {

  const box =
    document.createElement("div");


  box.className = "category";


  box.innerHTML = `

    <h2>${escapeHtml(info.category)}</h2>

    <div class="file">

      <div class="original">
        ${escapeHtml(filename)}
      </div>

      <div class="field">
        <strong>Document type:</strong>
        ${escapeHtml(info.type)}
      </div>

      <div class="field">
        <strong>Company:</strong>
        ${escapeHtml(info.company || "Not detected")}
      </div>

      <div class="field">
        <strong>Invoice number:</strong>
        ${escapeHtml(info.invoiceNumber || "Not detected")}
      </div>

      <div class="field">
        <strong>Date:</strong>
        ${escapeHtml(info.date || "Not detected")}
      </div>

      <div class="field">
        <strong>Amount:</strong>
        ${escapeHtml(info.amount || "Not detected")}
      </div>

      <div class="suggestion">
        Suggested filename:<br>
        ${escapeHtml(info.suggested)}
      </div>

    </div>

  `;


  results.appendChild(box);

}


function displayError(filename, message) {

  const box =
    document.createElement("div");


  box.className = "category";


  box.innerHTML = `

    <div class="file">

      <strong>${escapeHtml(filename)}</strong>

      <p>${escapeHtml(message)}</p>

    </div>

  `;


  results.appendChild(box);

}


function showStatus(message) {

  status.style.display = "block";

  status.textContent = message;

}


function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
</html>
